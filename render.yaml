# The public demonstration, on Render's free tier.
#
# A Blueprint rather than clicking through the dashboard: what the demo is
# configured with is then reviewable, and rebuilding it after the free
# database expires is one button rather than remembering nine fields.
#
# Free tier, deliberately and with two consequences that are not worked
# around here because they cannot be:
#
#   - The web service spins down after 15 minutes without inbound traffic.
#     .github/workflows/demo-keepalive.yml pokes it during the working day,
#     which helps and does not fix it: outside that window it sleeps on
#     purpose — a free workspace has 750 instance hours a month and staying
#     awake around the clock spends nearly all of them — and inside it,
#     GitHub's scheduler runs late under load. So the first visitor sometimes
#     waits out a cold start either way. Paid is $7/month and removes the
#     whole problem.
#   - **A free Postgres expires after 30 days, plus a 14-day grace
#     period.** Nothing prevents that.
#     Every trial tenant and everything in them goes with it, and the
#     Blueprint has to be applied again to get a new one. Put a reminder
#     somewhere that is not this file.
#
# Six values are not written here. Render asks for each of them at apply time
# — see docs/public-demo.md for what to put in them, and
# deploy/demo-values.example.env for the list to keep, since a rebuild asks
# again.
services:
  - type: web
    name: portico-demo
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    # The repository root, because the Dockerfile copies the whole tree: it
    # builds the console, the manual and the server, all of which live above
    # deploy/.
    dockerContext: .
    plan: free
    # Nearest to the people this demo is for. Render's free tier offers no
    # choice beyond its listed regions; change this before the first apply,
    # because a service cannot be moved afterwards.
    region: singapore

    # What Render polls to decide the instance is up. It does not keep a free
    # service awake — spin-down is decided by inbound traffic from outside,
    # which an internal check is not. That is what the keepalive workflow is
    # for.
    healthCheckPath: /api/v1/health

    envVars:
      # Which port Render routes to. The image listens on 8410 — deploy/
      # Dockerfile sets PORTICO_ADDR and EXPOSEs it — and Portico does not
      # read PORT, so this is not what makes the server bind: it is what
      # stops Render having to guess. Left out, a service whose port is not
      # detected sits at "no open ports detected" with a build that
      # succeeded, which reads as a broken image rather than a missing line.
      - key: PORT
        value: "8410"

      - key: PORTICO_DB_DSN
        fromDatabase:
          name: portico-demo-db
          property: connectionString

      # Believe the forwarding headers, because on this platform there is
      # always something in front: Render routes every request through its
      # own edge, so the address the server reads off the connection is that
      # router's and never a visitor's.
      #
      # Which quietly aims the abuse limits at the wrong target. The trial
      # signup caps requests per client address per day, and with every
      # arrival wearing the same address the whole internet shares one
      # counter — the sixth stranger to ask for a trial is refused, politely,
      # by a limit that looks like it is working.
      #
      # Only safe because of what is in front. The header is a claim anybody
      # can write, so ClientIP reads the *rightmost* entry — the one the
      # nearest proxy appended — rather than the leftmost, which is whatever
      # the client said. That entry is the truth as long as the request
      # reached Render directly. Put another proxy in front (a CDN in
      # proxying mode) and the rightmost becomes that proxy's address
      # instead, so the domain in front of this has to resolve straight to
      # Render — DNS-only, not proxied.
      - key: PORTICO_TRUST_PROXY_HEADERS
        value: "true"

      # Generated once and kept by Render. Regenerating it signs everybody
      # out, which for a demonstration is a shrug.
      - key: PORTICO_JWT_SECRET
        generateValue: true

      # Must be 32 bytes as 64 hexadecimal characters, which generateValue
      # does not produce — so it is entered by hand. Without it the server
      # still runs and refuses to store a directory bind password or a
      # webhook header, which the seeded data works around rather than fails
      # on. Generate with: openssl rand -hex 32
      - key: PORTICO_ENCRYPTION_KEY
        sync: false

      # The password the `admin` account is created with, on the first start
      # against an empty database.
      #
      # Asked for at apply time, and that timing is the whole point. Left
      # unset, the account is created with the default that is written down in
      # docs/access-guide.md — and sign-in refuses it until it is replaced,
      # which protects an instance on somebody's laptop and does nothing for
      # one on a public address: the first stranger to read the manual is
      # offered the replacement prompt, and whoever answers it chooses a
      # password the owner does not know, on an account with no address to
      # recover through.
      #
      # There is no window to fix this in afterwards. The service is reachable
      # from the moment it deploys, and the account exists from the moment it
      # first starts. Which is why this is a prompt rather than a note in a
      # document about what to change later.
      - key: PORTICO_INITIAL_ADMIN_PASSWORD
        sync: false

      # The address this deployment answers on, which only exists after the
      # first deploy — so it is filled in afterwards, and the service
      # redeployed. It is not cosmetic: OpenID Connect redirects and SAML
      # metadata are built from it, so a wrong value gives a console that
      # works perfectly and every single-sign-on flow sending the browser
      # somewhere unreachable.
      - key: PORTICO_PUBLIC_URL
        sync: false

      # Free tier holds this at 512MB. Stated rather than left implicit
      # because the seed is the memory-hungriest thing that runs here.
      - key: PORTICO_LOG_LEVEL
        value: info

      # The three switches below are prompts rather than values, and the
      # difference is which side wins.
      #
      # A key declared here with a literal `value` makes this file the
      # authority: set it in the dashboard and the next sync puts it back to
      # what is written here. These three are exactly the ones a deployment
      # decides for itself — a private console wants all three off, a public
      # demonstration wants all three on — so a file that overrules the
      # dashboard would silently close the trial signup and the landing page
      # on the next unrelated commit, with nothing to say so.
      #
      # `sync: false` inverts that: Render asks once per apply and then leaves
      # the dashboard alone. Still listed rather than left out entirely,
      # because a switch that exists only in somebody's memory of having
      # flipped it has to be remembered again every rebuild — and the free
      # database makes that monthly.

      # What a stranger finds at the root address. Off, "/" is the sign-in
      # form — right where everybody arriving already has an account, and
      # wrong on a public address, where the form asks for something the
      # visitor does not have.
      #
      # A public address wants this on; a company's own console wants it
      # off. Hence the prompt above rather than a value here.
      - key: PORTICO_LANDING_PAGE
        sync: false

      # The tenant console: one screen listing every tenant on the
      # deployment and how much is in each, visible only to an administrator
      # of the default tenant. Sizes only — it can count what is inside
      # another tenant and cannot open any of it.
      #
      # Worth turning on wherever trials are on, for the same reason: they
      # are what creates tenants you did not create by hand.
      - key: PORTICO_TENANT_CONSOLE
        sync: false

      # Self-service trials: a visitor proves an email address and is given a
      # tenant of their own, filled with one of five industry worlds.
      #
      # Answer this one last, and not because the feature is unfinished: it
      # has a prerequisite this Blueprint cannot supply. The email address is
      # the whole of the identity check, so without a relay every request is
      # refused with TRIAL_MAIL_UNAVAILABLE — on before the relay is a button
      # that always fails, which is worse than no button.
      #
      # On a free instance the relay cannot be SMTP. Render blocks outbound
      # 25, 465 and 587 there, and the symptom is a connection timeout — no
      # correction to the relay settings fixes it. So add these in the
      # dashboard and set this to true:
      #
      #   PORTICO_MAIL_TRANSPORT   resend
      #   PORTICO_RESEND_API_KEY   a send-only key from the Resend dashboard
      #   PORTICO_MAIL_FROM        the sender, on a domain verified there
      #
      # On a paid instance SMTP works on 465 and 587 (25 stays blocked), and
      # these are the keys instead:
      #
      #   PORTICO_SMTP_HOST        the relay
      #   PORTICO_SMTP_PORT        587 for starttls, 465 for implicit tls
      #   PORTICO_SMTP_USERNAME    if the relay wants one
      #   PORTICO_SMTP_PASSWORD    likewise
      #   PORTICO_SMTP_FROM        the sender, which most relays insist on
      #   PORTICO_SMTP_ENCRYPTION  starttls | tls | none
      #
      # Whichever it is: something that lets anything through will be used to
      # send something else, because this sends to addresses strangers type
      # in. Pick a provider with a sending quota and watch it.
      - key: PORTICO_TRIAL_SIGNUP
        sync: false

      # How many trial tenants may exist at once. Reached, the form says so
      # rather than queueing.
      #
      # Fifty is bounded by attention rather than by disk — see the note on
      # the database below.
      - key: PORTICO_TRIAL_MAX_TENANTS
        value: "50"

# Free Postgres: 1GB, expiring after 30 days plus a 14-day grace period.
#
# Disk is not the constraint, which is worth writing down because this file
# used to guess that it was. Measured on a development database holding the
# full development seed — two tenants, fifty-five accounts, ninety days of
# audit trail, sessions and webhook deliveries — plus four trial tenants: the
# whole thing is 11MB. A trial tenant is fifteen accounts, eight or nine
# organizations and about forty audit entries, which is a rounding error
# beside the seed. Fifty of them do not approach 1GB.
#
# The expiry at the top of this file is the limit that matters.
databases:
  - name: portico-demo-db
    plan: free
    # The same region as the service above, stated rather than left to the
    # workspace default — and this is not tidiness.
    #
    # fromDatabase hands the service the *internal* connection string, whose
    # hostname is a bare `dpg-…-a` resolvable only from inside that region.
    # A database in one region and a service in another therefore fail at
    # `no such host` on the first connection, which reads as a database that
    # was never created rather than as two things in different places. The
    # build succeeds, the image is fine, and the deploy exits 1.
    #
    # Left unspecified, the region is whatever the workspace defaults to, so
    # whether this works at all depended on where the person applying the
    # Blueprint happened to be set up. It did not work.
    region: singapore
    databaseName: portico
    user: portico
