openapi: 3.1.0

info:
  title: Portico
  version: 0.1.0
  summary: The management and self-service API.
  description: |
    Portico's own HTTP API, under `/api/v1`.

    **What is deliberately not here.** SCIM 2.0 is defined by RFC 7643 and
    RFC 7644, and OpenID Connect, OAuth 2.1, SAML 2.0, and CAS are defined by
    their own specifications. Restating them in house style would produce a
    second description that can disagree with the first, and clients for
    those protocols read the specification rather than this file. `/api/v1`
    is the surface that has no external definition, so it is the surface this
    document covers. See `docs/scim.md` and `docs/federation.md` for the
    rest, and `docs/webhooks.md` for the outbound side, which is a request
    Portico makes rather than one it serves.

    **Every response is wrapped**, including failures — see the `Envelope`
    schema. A client reads `code` to decide what happened; the HTTP status
    agrees with it but is coarser. `data` is always present and is `null`
    when there is no result.

    **Every request acts inside exactly one tenant.** For an authenticated
    call the tenant comes from the token and the `X-Tenant` header is
    ignored; sending one that disagrees changes nothing. Only sign-in,
    registration, and the other endpoints reachable without a token take the
    tenant from the header or the body, because there is no token yet.

    This file is checked against the running router by
    `TestOpenAPIDescribesEveryRoute`: an endpoint added without being
    described here, or described here without existing, fails the build.
    That test is the reason the document can be trusted; without it this
    would be a snapshot of what was true once.

  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: Portico
    url: https://github.com/Paraview-RD/portico

servers:
  - url: /
    description: The deployment serving this document.

tags:
  - name: Health
    description: Liveness and readiness, for orchestrators rather than people.
  - name: Authentication
    description: Signing in, signing out, registration, and password recovery.
  - name: Self-service
    description: What a signed-in person may do to their own account.
  - name: Federation
    description: |
      The seam between Portico's sign-in screen and the protocol endpoints.
      These are Portico's own, and follow Portico's conventions; the protocol
      endpoints themselves do not, and are not described here.
  - name: Users
    description: Account administration.
  - name: Organizations
    description: The organization chart. One per person, arranged as a tree.
  - name: Groups
    description: |
      Sets of people. Any number per person, flat, and usually maintained by
      a directory. Membership grants nothing.
  - name: Applications
    description: The systems that sign in through Portico.
  - name: Provisioning
    description: The credentials a directory authenticates to SCIM with.
  - name: Directories
    description: |
      Directories Portico reads accounts out of, which is the opposite
      direction from Provisioning: those let a directory push into /scim/v2,
      these have Portico connect to an AD or OpenLDAP and pull.
  - name: Webhooks
    description: Outbound event subscriptions and their delivery history.
  - name: Audit
    description: What happened, and who did it.
  - name: Settings
    description: Per-tenant configuration.

security:
  - bearerAuth: []

paths:
  /api/v1/health:
    get:
      tags: [Health]
      operationId: health
      summary: Whether this process is alive.
      description: |
        Deliberately does not touch the database. A database outage is not
        fixed by restarting every instance, and reporting one here would turn
        a failing dependency into a restart loop across the fleet at the
        moment it is least able to cope. Use `/ready` for that question.
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthEnvelope" }

  /api/v1/ready:
    get:
      tags: [Health]
      operationId: ready
      summary: Whether this instance can serve requests.
      description: Reaches the database, with a two-second bound.
      security: []
      responses:
        "200":
          description: The database is reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessEnvelope" }
        "503":
          description: |
            The database is not reachable. The reason is logged rather than
            returned: this endpoint is unauthenticated, and a driver error
            can carry a host, a port, and sometimes a user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in.
      description: |
        The identifier is a username, an email address, or a phone number;
        all three reach the same account and produce the same credential.

        A password that has expired is refused here rather than answered with
        a token and a flag — see `/api/v1/auth/password/expired`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: Username, email address, or phone number.
                password: { type: string, format: password }
                tenant:
                  type: string
                  description: |
                    Tenant code. Omit for the default tenant. There is no
                    token yet, so this is the only place the tenant can come
                    from.
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionEnvelope" }
        "401":
          description: |
            The credential was refused. The `code` says which of the reasons
            it was: `INVALID_CREDENTIALS`, `ACCOUNT_LOCKED` after repeated
            failed sign-ins, `ACCOUNT_DISABLED`, or `PASSWORD_EXPIRED` when
            the password is right but too old to use.

            All of them are 401 rather than a status per reason, because the
            distinction is in the body: a client branches on `code`, and the
            transport status only has to say "not signed in".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/TenantDisabled"
        "404":
          $ref: "#/components/responses/TenantNotFound"

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Register an account.
      description: |
        Available only where the tenant has registration switched on, which
        is off by default. The role cannot be requested: a self-registered
        account is always an ordinary user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, displayName, password]
              properties:
                username: { type: string }
                displayName: { type: string }
                password: { type: string, format: password }
                phone: { type: string }
                email: { type: string, format: email }
                tenant: { type: string }
      responses:
        "200":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "403":
          description: |
            `REGISTRATION_DISABLED` when registration is not open for this
            tenant, or `TENANT_DISABLED` when the tenant itself is off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/TenantNotFound"
        "503":
          $ref: "#/components/responses/DeliveryUnavailable"

  /api/v1/auth/registration-status:
    get:
      tags: [Authentication]
      operationId: registrationStatus
      summary: Whether registration is open, and what this tenant is called.
      description: Lets the sign-in screen decide whether to offer registration.
      security: []
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      responses:
        "200":
          description: The tenant's registration setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationStatusEnvelope" }
        "403":
          $ref: "#/components/responses/TenantDisabled"
        "404":
          $ref: "#/components/responses/TenantNotFound"

  /api/v1/auth/recovery-channels:
    get:
      tags: [Authentication]
      operationId: recoveryChannels
      summary: How a reset link can be delivered.
      description: |
        Empty when the deployment has neither a mail relay nor an SMS
        provider, which is how the screen knows not to offer recovery it
        cannot perform.
      security: []
      responses:
        "200":
          description: The available channels.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryChannelsEnvelope" }
        "403":
          $ref: "#/components/responses/TenantDisabled"
        "404":
          $ref: "#/components/responses/TenantNotFound"

  /api/v1/auth/register/verify:
    post:
      tags: [Authentication]
      operationId: confirmRegistration
      summary: Confirm the address a registration gave.
      description: |
        Redeems the link from the message. Public by necessity: the account
        cannot sign in until this succeeds, which is the point of it.

        Unknown, spent, and expired tokens all answer
        `INVALID_VERIFICATION_TOKEN`. Distinguishing them would tell somebody
        holding a stolen but dead link that it was once real, and a
        legitimate person does the same thing in all three cases — asks for
        another.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                tenant: { type: string }
                token: { type: string }
      responses:
        "200":
          description: The address is confirmed and the account can sign in.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          verified: { type: boolean }
        "400":
          description: The link is not valid or has already been used.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/TenantDisabled"
        "404":
          $ref: "#/components/responses/TenantNotFound"

  /api/v1/auth/register/verify/resend:
    post:
      tags: [Authentication]
      operationId: resendVerification
      summary: Send another confirmation link.
      description: |
        Answers 200 whether or not an account was found, whether or not it
        still needs confirming, and whether or not the message went out.
        This endpoint is public and unauthenticated, so anything else would
        make it an oracle for "does this address have an account here".

        Note the deliberate asymmetry with sign-in, which *does* disclose:
        an unconfirmed account is told so, because the alternative is a dead
        end for somebody who never opened the message. That disclosure is
        confined to a caller who already has the password.

        `destination` is the email address or phone number given at
        registration, not a username.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination]
              properties:
                tenant: { type: string }
                destination: { type: string }
      responses:
        "200":
          description: Accepted, whether or not anything was sent.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sent: { type: boolean }
        "403":
          $ref: "#/components/responses/TenantDisabled"
        "404":
          $ref: "#/components/responses/TenantNotFound"

  /api/v1/auth/password-recovery:
    post:
      tags: [Authentication]
      operationId: requestPasswordRecovery
      summary: Ask for a password reset link.
      description: |
        The answer is the same whether or not an account matched. An endpoint
        that said would be an account-existence oracle available to anybody.
      security: []
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, destination]
              properties:
                channel: { $ref: "#/components/schemas/RecoveryChannel" }
                destination:
                  type: string
                  description: The email address or phone number to send to.
                tenant:
                  type: string
                  description: |
                    Tenant code. Omit for the default tenant. The caller
                    cannot sign in — that is why they are here — so there is
                    no token to take it from, and this or the header is the
                    only way to say which tenant the account is in.
      responses:
        "200":
          description: Accepted, whether or not an account matched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageEnvelope" }
        "403":
          $ref: "#/components/responses/TenantDisabled"
        "404":
          $ref: "#/components/responses/TenantNotFound"
        "503":
          $ref: "#/components/responses/DeliveryUnavailable"

  /api/v1/auth/password-recovery/confirm:
    post:
      tags: [Authentication]
      operationId: confirmPasswordRecovery
      summary: Redeem a password reset link.
      description: |
        The tenant reaches the caller in the reset link and is sent back in
        `tenant` below. Redeeming ends every session the account had.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, format: password }
                tenant:
                  type: string
                  description: |
                    Tenant code. Omit for the default tenant. As above, there
                    is no token to read it from: whoever is redeeming a reset
                    link is by definition not signed in.
      responses:
        "200":
          description: The password was replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReauthenticationEnvelope" }
        "400":
          description: The link is expired, already used, or not valid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/TenantDisabled"
        "404":
          $ref: "#/components/responses/TenantNotFound"

  /api/v1/auth/password/expired:
    post:
      tags: [Authentication]
      operationId: changeExpiredPassword
      summary: Replace an expired password, and sign in.
      description: |
        Public by necessity: the caller cannot sign in, because sign-in
        refuses an expired password rather than issuing a token and trusting
        the client to act on a flag. Refuses if the password has not in fact
        expired.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, currentPassword, newPassword]
              properties:
                identifier: { type: string }
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
                tenant: { type: string }
      responses:
        "200":
          description: Replaced, and signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/TenantDisabled"
        "404":
          $ref: "#/components/responses/TenantNotFound"

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: End this session.
      description: |
        This one only. Signing out on a laptop no longer signs you out on a
        phone; `/auth/logout-everywhere` is for that.

        It does, however, end every federated session this account holds —
        refresh tokens issued to relying parties are revoked. What no
        identity provider can withdraw is an access token already in
        somebody's hands, or a session an application created for itself
        after accepting an assertion. See `docs/federation.md`.
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout-everywhere:
    post:
      tags: [Authentication]
      operationId: logoutEverywhere
      summary: End every session this account has.
      responses:
        "200":
          description: All sessions ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/permission-check:
    get:
      tags: [Authentication]
      operationId: checkPermission
      summary: Who the caller is, and whether they are an administrator.
      description: |
        For a downstream system that has been handed a token and needs to
        know what it represents. It takes no parameters: there is nothing to
        ask about, because this version has two fixed roles and no permission
        assignment — `isAdmin` is the whole answer.

        Readable by any authenticated caller on purpose. A downstream service
        acts with the user's own token, on that user's behalf.

        The name is broader than what it does. It is kept because clients
        call it, and renaming an endpoint to describe the version that has
        real permissions is a change to make when that version exists.
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrincipalEnvelope" }

        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users/export:
    get:
      tags: [Users]
      operationId: exportUsers
      summary: The tenant's accounts as a spreadsheet.
      description: |
        The same columns the import template has, so a file taken from here
        can be edited and fed back in — which is what bulk operations means
        in practice for most people who ask for one. It takes the same
        filters the listing does, so "export what I am looking at" is one
        call rather than a second concept.

        **No passwords, and no column for one.** The import template has that
        column because creating an account needs an initial password; an
        export is a report, and a report carrying credentials is a
        credential-distribution mechanism nobody meant to build.

        Audited. This is every attribute of every account in the tenant
        leaving through one request — nothing else here hands over that much
        at once, and "who took a copy of the directory, and when" is asked
        after an incident rather than before one.
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/Status" }
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
        - $ref: "#/components/parameters/OrganizationFilter"
      responses:
        "200":
          description: An .xlsx workbook.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users/bulk/status:
    post:
      tags: [Users]
      operationId: bulkSetUserStatus
      summary: Enable or disable several accounts.
      description: |
        Each account goes through exactly the path a single one takes, which
        is the point rather than an inefficiency: every rule that applies to
        disabling one applies here — the last active administrator cannot be
        disabled, nobody can disable themselves, sessions and federated
        refresh tokens end immediately, and each is recorded in the trail. A
        bulk path writing straight to the table would be a way around all of
        them, and an invisible one.

        Failures are collected rather than fatal, and reported per account.
        Somebody who selected forty people and hit one they may not disable
        wants the other thirty-nine done and a note about the one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds, status]
              properties:
                userIds:
                  type: array
                  items: { type: string }
                  maxItems: 500
                status: { $ref: "#/components/schemas/Status" }
      responses:
        "200":
          description: What each account did.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResultEnvelope" }
        "400":
          description: More accounts than one request may carry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users/bulk/organization:
    post:
      tags: [Users]
      operationId: bulkSetUserOrganization
      summary: Move several accounts into one organization.
      description: |
        An empty `organizationId` moves them out of any, which is a real
        request rather than an omission.

        Everything else about each account is carried through unchanged — the
        endpoint replaces an account's editable fields, so sending only the
        organization would blank a display name and demote an administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds:
                  type: array
                  items: { type: string }
                  maxItems: 500
                organizationId: { type: string }
      responses:
        "200":
          description: What each account did.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResultEnvelope" }
        "400":
          description: More accounts than one request may carry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users/me:
    get:
      tags: [Self-service]
      operationId: me
      summary: The caller's own account.
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Self-service]
      operationId: updateOwnProfile
      summary: Update the caller's own details.
      description: |
        Role, status, organization, and username are absent by design, and
        the server rejects them rather than ignoring them. Changing any of
        those is a decision about somebody's access, which is an
        administrator's to make.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string }
                phone: { type: string }
                email: { type: string, format: email }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/users/me/close:
    post:
      tags: [Self-service]
      operationId: closeOwnAccount
      summary: Close your own account.
      description: |
        The one sanctioned way to disable yourself. Everywhere else that is
        refused, so an administrator cannot lock themselves out by accident;
        this is the case that rule was never about.

        It deactivates rather than deletes, matching every other decision in
        this system: the account stops signing in, every session and every
        federated refresh token dies immediately, and an administrator can
        reinstate it. Signing in afterwards answers `ACCOUNT_CLOSED` rather
        than `ACCOUNT_DISABLED`, because the two call for different responses.

        The password is required for the same reason changing one requires it:
        a stolen token must not be enough to destroy the account it was
        stolen from. The last active administrator in a tenant cannot close
        their account — there would be nobody left who could undo it.

        The token this request was made with is dead by the time the response
        arrives.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        "200":
          description: Closed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          closed: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: |
            The password did not match (`CURRENT_PASSWORD_MISMATCH`), or this
            is the tenant's last active administrator (`LAST_ADMIN`) — there
            would be nobody left who could reinstate the account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /api/v1/users/{id}/profile:
    put:
      tags: [Users]
      operationId: setUserProfile
      summary: Write an account's descriptive attributes.
      description: |
        Separate from `PUT /api/v1/users/{id}`, which changes role, status,
        and organization. Those decide access; these describe a person. One
        endpoint taking both would mean a form editing a job title has to
        send a role, and sending the wrong one by omission is how a screen
        becomes a privilege-escalation endpoint.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserProfile" }
      responses:
        "200":
          description: The account, with the attributes as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another account already has that employee number.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/users/me/profile:
    put:
      tags: [Self-service]
      operationId: setOwnProfileAttributes
      summary: Maintain your own descriptive attributes.
      description: |
        The same fields an administrator can write, minus the manager: who
        somebody reports to is an organizational fact rather than a personal
        detail, and a self-service screen that could set it would let anybody
        claim anybody as their manager — which downstream systems read as an
        approval chain. A `managerId` sent here is ignored rather than
        refused.

        Safe to expose for the reason the split exists: this cannot reach a
        role, a status, or an organization, so there is nothing to escalate
        with.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserProfile" }
      responses:
        "200":
          description: The account, with the attributes as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Another account already has that employee number.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /api/v1/users/me/password:
    post:
      tags: [Self-service]
      operationId: changeOwnPassword
      summary: Change the caller's own password.
      description: |
        Ends every session, including this one — `reauthenticationRequired`
        says so. A password change that left other sessions alive would not
        be a remedy for the case people use it for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReauthenticationEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/users/me/groups:
    get:
      tags: [Self-service]
      operationId: listOwnGroups
      summary: The groups the caller belongs to.
      description: |
        Separate from the administrator's view of somebody else's groups,
        which is a different act. The account is taken from the token and
        never from a path, so there is no version of this that can be asked
        about another person.
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupRefListEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/me/sessions:
    get:
      tags: [Self-service]
      operationId: listOwnSessions
      summary: The caller's own live sessions.
      description: |
        No token is present and never will be: the server stores a digest,
        so there is nothing here to leak even by accident.
      responses:
        "200":
          description: Sessions, most recently used first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSessionListEnvelope" }

        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users/me/sessions/{sessionID}:
    delete:
      tags: [Self-service]
      operationId: revokeOwnSession
      summary: End one of the caller's own sessions.
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: Ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/oauth/authorize:
    post:
      tags: [Federation]
      operationId: authorizeOAuth
      summary: Complete an OAuth authorization request for the signed-in user.
      description: |
        Portico's own endpoint, not OAuth's. The sign-in screen calls it once
        somebody has authenticated and is told where to send the browser
        next — the provider's callback, where the code is issued.

        The subject is never accepted as input; it comes from the token. An
        endpoint that took one would issue codes for other people.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authRequestId]
              properties:
                authRequestId: { type: string }
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizationEnvelope" }
        "400":
          description: The request is expired, already used, or unknown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /api/v1/saml/authenticate:
    post:
      tags: [Federation]
      operationId: authorizeSAML
      summary: Complete a SAML authentication request for the signed-in user.
      description: |
        Separate from the OAuth endpoint because the two protocols park their
        in-flight requests separately; an id from one means nothing to the
        other.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [samlRequestId]
              properties:
                samlRequestId: { type: string }
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizationEnvelope" }
        "400":
          description: The request is expired, already used, or unknown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /api/v1/cas/authorize:
    post:
      tags: [Federation]
      operationId: authorizeCAS
      summary: Issue a CAS ticket for the signed-in user.
      description: |
        The request is the service URL itself. It is checked against the
        tenant's registrations rather than trusted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service]
              properties:
                service: { type: string, format: uri }
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizationEnvelope" }
        "400":
          description: The service is not registered in this tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /api/v1/organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      summary: Every organization in the tenant.
      description: |
        Flat, with each row naming its parent, rather than nested: a nested
        payload cannot be sorted or filtered without being taken apart again.

        Readable by any signed-in caller because the profile screen needs it;
        writing is administrator-only.
      parameters:
        - name: activeOnly
          in: query
          schema: { type: boolean }
          description: Omit disabled organizations.
      responses:
        "200":
          description: The organizations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationListEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Create an organization.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationCreate" }
      responses:
        "200":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/organizations/{id}:
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: One organization.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Organizations]
      operationId: updateOrganization
      summary: Update an organization.
      description: |
        The code is absent: downstream systems store it, so it is fixed at
        creation. Changing `parentId` moves the subtree; the server refuses
        a move that would put an organization under itself, and refuses one
        that would nest deeper than the tree allows.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                remark: { type: string }
                parentId:
                  type: string
                  description: Empty makes it a root.
                sortOrder: { type: integer }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/organizations/{id}/enable:
    post:
      tags: [Organizations]
      operationId: enableOrganization
      summary: Enable an organization.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/organizations/{id}/disable:
    post:
      tags: [Organizations]
      operationId: disableOrganization
      summary: Disable an organization.
      description: |
        Existing members keep their membership; no new ones can be assigned.
        There is no delete — the audit trail keeps pointing at something that
        still exists.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/portal/applications:
    get:
      tags: [Self-service]
      operationId: portalApplications
      summary: The applications a person can open.
      description: |
        Readable by any signed-in caller, which is the point: this is the home
        screen for somebody who is not an administrator, and every other
        application endpoint requires one.

        **These are the tenant's applications, not the caller's.** This
        version has no notion of who may use what — two fixed roles, no
        assignment — so every authenticated person may sign in to every
        registered application, and this list says the same thing to
        everybody. A client showing it should say so rather than implying an
        entitlement that does not exist.

        Disabled registrations are omitted, and so are those with no
        `launchUrl`: a tile that cannot be opened is not an offer.
      responses:
        "200":
          description: The applications, by name.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/PortalApplicationListEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Accounts in the tenant.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          schema: { type: string }
          description: Matches username or display name.
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/Status" }
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
        - $ref: "#/components/parameters/OrganizationFilter"
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPageEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Users]
      operationId: createUser
      summary: Create an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, displayName, password, role]
              properties:
                username: { type: string }
                displayName: { type: string }
                password: { type: string, format: password }
                phone: { type: string }
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/Role" }
                organizationId: { type: string }
      responses:
        "200":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/users/{id}:
    get:
      tags: [Users]
      operationId: getUser
      summary: One account.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Users]
      operationId: updateUser
      summary: Update an account.
      description: |
        The username is absent: it is what the audit trail and every
        downstream system refer to. A directory-provisioned account can be
        renamed, but only over SCIM, where the directory is the system of
        record.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, role]
              properties:
                displayName: { type: string }
                phone: { type: string }
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/Role" }
                organizationId: { type: string }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/users/{id}/enable:
    post:
      tags: [Users]
      operationId: enableUser
      summary: Enable an account.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{id}/disable:
    post:
      tags: [Users]
      operationId: disableUser
      summary: Disable an account.
      description: |
        Immediate: every session ends and the account cannot sign in again.
        Accounts are disabled, never deleted, so the audit trail stays whole.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{id}/password:
    post:
      tags: [Users]
      operationId: resetUserPassword
      summary: Set somebody else's password.
      description: Ends every session that account had.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { type: string, format: password }
      responses:
        "200":
          description: Reset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/users/{id}/unlock:
    post:
      tags: [Users]
      operationId: unlockUser
      summary: Clear a lockout.
      description: |
        Leaves the password alone. The person mistyped it; they did not lose
        it, and forcing a reset would treat a typo as a compromise.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Unlocked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{id}/groups:
    get:
      tags: [Users]
      operationId: listUserGroups
      summary: The groups an account belongs to.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupRefListEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{id}/sessions:
    get:
      tags: [Users]
      operationId: listUserSessions
      summary: What is signed in as somebody.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Their sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSessionListEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{id}/sessions/{sessionID}:
    delete:
      tags: [Users]
      operationId: revokeUserSession
      summary: End one of somebody's sessions.
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: Ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/import:
    post:
      tags: [Users]
      operationId: importUsers
      summary: Create accounts from a spreadsheet.
      description: |
        Every row is processed independently and the response reports each
        failure with its row number. A batch that stopped at the first bad
        row would make a hundred good rows depend on the worst one.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: An `.xlsx` file matching the template.
      responses:
        "200":
          description: |
            The outcome per row. A 200 here means the file was read, not that
            every row succeeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResultEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/users/import/template:
    get:
      tags: [Users]
      operationId: importTemplate
      summary: Download the import template.
      description: |
        Generated from the same column list the parser reads, so the two
        cannot drift.
      responses:
        "200":
          description: The workbook.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/groups:
    get:
      tags: [Groups]
      operationId: listGroups
      summary: Every group in the tenant.
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupListEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Groups]
      operationId: createGroup
      summary: Create a group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string }
                description: { type: string }
      responses:
        "200":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/groups/{id}:
    get:
      tags: [Groups]
      operationId: getGroup
      summary: One group.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Groups]
      operationId: updateGroup
      summary: Update a group.
      description: |
        A group whose `source` is `SCIM` may be edited here, and the next
        synchronization may overwrite what you wrote. The directory is the
        system of record for those.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string }
                description: { type: string }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Groups]
      operationId: deleteGroup
      summary: Delete a group.
      description: |
        Deleted, not disabled — unlike an account. A group is a set rather
        than a party the audit trail refers to, and directories delete and
        recreate them, which would otherwise accumulate.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/groups/{id}/members:
    get:
      tags: [Groups]
      operationId: listGroupMembers
      summary: Who is in a group.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMemberListEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Groups]
      operationId: addGroupMembers
      summary: Add members to a group.
      description: |
        An account that does not exist in this tenant is refused, not
        skipped. Skipping would leave a group that looks synchronized and is
        not, which is the one failure the other side cannot see.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400":
          description: One of the accounts does not exist in this tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/groups/{id}/members/{userID}:
    delete:
      tags: [Groups]
      operationId: removeGroupMember
      summary: Remove one member from a group.
      description: |
        Removes the membership. The account is untouched — membership grants
        nothing, so removing it takes nothing away but the membership.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: userID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      summary: What happened.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/LogKind" }
        - name: action
          in: query
          schema: { type: string }
        - name: keyword
          in: query
          schema: { type: string }
          description: Matches the actor or the target, as a substring.
        - name: actor
          in: query
          schema: { type: string }
          description: |
            One actor, matched exactly. Separate from `keyword` because the
            questions are different: `keyword` is what somebody types into a
            search box, and this answers "what did this actor do". Passing
            `scim` here returns what a directory changed, without also
            returning every record whose name contains the word.
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: A page of entries, most recent first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogPageEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: This tenant's settings.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Settings]
      operationId: updateSettings
      summary: Update this tenant's settings.
      description: |
        Every field is optional and only what you send is changed — this
        endpoint overlays rather than replacing, which is the one place in
        this API where PUT does not mean a full replace.

        That is deliberate. Several of these treat zero as a value rather
        than as absence: `lockoutThreshold` 0 switches lockout off,
        `oidcSessionMaxAgeDays` 0 removes the cap on a refresh chain,
        `auditRetentionDays` 0 keeps everything, and `defaultLocale` ""
        means "follow the deployment". Under a true replace, omitting a
        field would silently turn those off, so "not sent" and "sent as
        zero" have to be different things.

        Send only what you are changing. `passwordMinLength` has a floor no
        policy can lower.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/applications/integration-endpoints:
    get:
      tags: [Applications]
      operationId: integrationEndpoints
      summary: What to configure at the other end of an integration.
      description: |
        Every value is derived by the server from its own public URL and the
        tenant's code, so what a screen shows cannot drift from what is
        actually served.
      responses:
        "200":
          description: The addresses.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/IntegrationEndpointsEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/applications/logos:
    post:
      tags: [Applications]
      operationId: uploadApplicationLogo
      summary: Store a picture for an application's tile.
      description: |
        Returns the path to reference the stored file by, which goes into the
        `logoUri` of whichever application is being registered. Not nested
        under a protocol: one picture is one picture whichever of the three an
        application speaks, and the upload has to happen before the
        registration is saved — so it cannot belong to a client that does not
        exist yet.

        **PNG and JPEG only, and the format is decided by the file's own
        bytes** rather than by its name or its declared type, both of which are
        chosen by whoever sends the request. An SVG is refused: it is a
        document that can carry script, and an uploaded file is served back
        from this server's own address. Rendered through `<img>` a browser will
        not run that script, which is why an SVG *path* remains acceptable —
        but a file that arrived through a form can also be opened directly, in
        a tab, where it is a page with this origin's cookies.

        An upload that no application ends up referencing is removed a day
        later.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    A PNG or JPEG, at most 512 KiB and 1024 pixels a side.
      responses:
        "200":
          description: The path the picture is served from.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ApplicationLogoEnvelope" }
        "400":
          description: |
            The file is not a PNG or JPEG (`UNSUPPORTED_IMAGE`), or is past the
            size or pixel bound (`LOGO_TOO_LARGE`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/applications/oauth-clients:
    get:
      tags: [Applications]
      operationId: listOAuthClients
      summary: Registered OAuth 2.1 / OpenID Connect clients.
      responses:
        "200":
          description: The clients.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthClientListEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Applications]
      operationId: createOAuthClient
      summary: Register a client.
      description: |
        A confidential client's secret is in this response and nowhere else,
        ever: only a hash is stored. Losing it means rotating, not
        recovering.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, name, redirectUris]
              properties:
                clientId:
                  type: string
                  description: Letters, digits, and `. _ -` only.
                name: { type: string }
                public:
                  type: boolean
                  description: |
                    True for a browser or mobile application, which cannot
                    keep a secret and authenticates with PKCE alone.
                applicationType:
                  type: string
                  enum: [WEB, NATIVE, USER_AGENT]
                redirectUris:
                  type: array
                  items: { type: string, format: uri }
                  description: |
                    Plain http is refused except on loopback: the
                    authorization code is delivered here.
                postLogoutRedirectUris:
                  type: array
                  items: { type: string, format: uri }
                scopes:
                  type: array
                  items: { type: string }
                launchUrl:
                  type: string
                  description: |
                    Where a person opens this application, for the portal.
                    Optional. Must be http or https — it is rendered as a
                    link, and a scheme that executes would be stored
                    cross-site scripting aimed at everyone who opens the
                    portal.
                logoUri:
                  type: string
                  description: |
                    The picture on this application's portal tile. Optional;
                    without one the tile carries the first character of the
                    name. Either an absolute http(s) URL or a path on this
                    server such as /icons/wiki.svg — the second keeps the
                    portal working with no outbound network and tells no
                    third party who opened it.
      responses:
        "200":
          description: Registered, with the secret if it is confidential.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisteredClientEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/applications/oauth-clients/{clientID}:
    get:
      tags: [Applications]
      operationId: getOAuthClient
      summary: One client.
      parameters:
        - $ref: "#/components/parameters/ClientID"
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthClientEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Applications]
      operationId: updateOAuthClient
      summary: Update a client.
      description: "The client id is fixed: it is what the client presents."
      parameters:
        - $ref: "#/components/parameters/ClientID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, redirectUris]
              properties:
                name: { type: string }
                applicationType:
                  type: string
                  enum: [WEB, NATIVE, USER_AGENT]
                redirectUris:
                  type: array
                  items: { type: string, format: uri }
                postLogoutRedirectUris:
                  type: array
                  items: { type: string, format: uri }
                scopes:
                  type: array
                  items: { type: string }
                launchUrl: { type: string }
                logoUri: { type: string }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthClientEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/applications/oauth-clients/{clientID}/enable:
    post:
      tags: [Applications]
      operationId: enableOAuthClient
      summary: Enable a client.
      parameters:
        - $ref: "#/components/parameters/ClientID"
      responses:
        "200":
          description: Enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthClientEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/applications/oauth-clients/{clientID}/disable:
    post:
      tags: [Applications]
      operationId: disableOAuthClient
      summary: Disable a client.
      description: |
        Immediate: it can no longer sign anyone in, and its credentials stop
        authenticating at the introspection and revocation endpoints too.
      parameters:
        - $ref: "#/components/parameters/ClientID"
      responses:
        "200":
          description: Disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthClientEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/applications/oauth-clients/{clientID}/rotate-secret:
    post:
      tags: [Applications]
      operationId: rotateOAuthClientSecret
      summary: Issue a new secret.
      description: |
        The old one stops working immediately. There is no overlap window, so
        configure the new secret at the other end before rotating.
      parameters:
        - $ref: "#/components/parameters/ClientID"
      responses:
        "200":
          description: Rotated. The new secret is here and nowhere else.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisteredClientEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/applications/saml-service-providers:
    get:
      tags: [Applications]
      operationId: listServiceProviders
      summary: Registered SAML 2.0 service providers.
      responses:
        "200":
          description: The service providers.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ServiceProviderListEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Applications]
      operationId: createServiceProvider
      summary: Register a service provider.
      description: |
        The registration is the other end's own metadata document. Its entity
        id and assertion consumer services are read out of it rather than
        typed in beside it, so the two cannot disagree.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, metadataXml]
              properties:
                name: { type: string }
                metadataXml: { type: string }
                launchUrl: { type: string }
                logoUri: { type: string }
      responses:
        "200":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceProviderEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/applications/saml-service-providers/{id}:
    get:
      tags: [Applications]
      operationId: getServiceProvider
      summary: One service provider.
      description: |
        Addressed by the registration's own id, not by its entity id. An
        entity id is a URI: percent-encoding one into a path segment works
        until a reverse proxy normalizes the path, decodes the `%2F`, and
        splits the identifier — at which point every request 404s in
        production and nowhere else.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The service provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceProviderEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Applications]
      operationId: updateServiceProvider
      summary: Update a service provider.
      description: Replacing the metadata is how a certificate is rotated.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, metadataXml]
              properties:
                name: { type: string }
                metadataXml: { type: string }
                launchUrl: { type: string }
                logoUri: { type: string }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceProviderEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/applications/saml-service-providers/{id}/enable:
    post:
      tags: [Applications]
      operationId: enableServiceProvider
      summary: Enable a service provider.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceProviderEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/applications/saml-service-providers/{id}/disable:
    post:
      tags: [Applications]
      operationId: disableServiceProvider
      summary: Disable a service provider.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceProviderEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/applications/cas-services:
