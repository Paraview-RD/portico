    Field:
      type: object
      description: One entry of the field catalogue.
      properties:
        key:
          type: string
          description: |
            Stable, and what a mapping stores. Never translated and never
            reused.
        group:
          type: string
          enum: [identity, profile, organization, tenant, custom]
        kind:
          type: string
          enum: [TEXT, NUMBER, BOOLEAN, DATE, SELECT]
        label:
          type: string
          description: |
            Present for a tenant-defined field, whose name is whatever somebody
            typed. Absent for a built-in one, whose label the console holds in
            its own message catalogue — a built-in has to read the same in both
            languages, and a stored string cannot do that.
        custom: { type: boolean }
        inbound:
          type: boolean
          description: Whether a directory may write this.
        outboundOnlyBecause:
          type: string
          description: Present exactly when `inbound` is false.
        allowedValues:
          type: array
          items: { type: string }
        disabled:
          type: boolean
          description: A retired tenant-defined attribute. Its values are kept.

    FieldListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Field" }

    UserAttributeDefinition:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        key: { type: string, description: "Fixed at creation." }
        label: { type: string }
        description: { type: string }
        kind:
          type: string
          enum: [TEXT, NUMBER, BOOLEAN, DATE, SELECT]
        allowedValues:
          type: array
          items: { type: string }
        required:
          type: boolean
          description: |
            An administrator's form will not save without it. It deliberately
            does not apply to a directory synchronization: a required attribute
            no LDAP entry carries would turn one form rule into a refusal to
            import anybody.
        sortOrder: { type: integer }
        status: { $ref: "#/components/schemas/Status" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserAttributeRequest:
      type: object
      required: [label, kind]
      properties:
        key:
          type: string
          description: |
            Required on creation, ignored on update. 3 to 40 characters of
            lower-case letters, digits, and underscores, starting with a letter.
        label: { type: string }
        description: { type: string }
        kind:
          type: string
          enum: [TEXT, NUMBER, BOOLEAN, DATE, SELECT]
        allowedValues:
          type: array
          items: { type: string }
          description: Required for SELECT, ignored otherwise.
        required: { type: boolean }
        sortOrder: { type: integer }

