  /api/v1/directories:
    get:
      tags: [Directories]
      operationId: listDirectories
      summary: The directories accounts are read out of.
      responses:
        "200":
          description: The directories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LDAPSourceListEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Directories]
      operationId: createDirectory
      summary: Register a directory.
      description: |
        The attribute map has no defaults, deliberately. Active Directory and
        OpenLDAP disagree on every one of them — `sAMAccountName` against
        `uid`, `objectGUID` against `entryUUID` — and a wrong guess imports a
        directory's worth of accounts named after the wrong field, which
        looks like a working integration.

        `attrExternalId` is the reconciliation key and the most consequential
        setting here: it is what makes a rename in the directory a rename
        rather than a second account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LDAPSourceRequest" }
      responses:
        "200":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LDAPSourceEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/directories/{id}:
    get:
      tags: [Directories]
      operationId: getDirectory
      summary: One directory.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The directory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LDAPSourceEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Directories]
      operationId: updateDirectory
      summary: Update a directory.
      description: |
        Omitting `bindPassword` leaves the stored credential alone, which is
        what an edit form that cannot display it has to be able to express.
        Sending it as an empty string clears it, which is how a source moves
        to an anonymous bind.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LDAPSourceRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LDAPSourceEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/directories/{id}/enable:
    post:
      tags: [Directories]
      operationId: enableDirectory
      summary: Enable a directory.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LDAPSourceEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/directories/{id}/disable:
    post:
      tags: [Directories]
      operationId: disableDirectory
      summary: Stop a directory synchronizing.
      description: |
        The accounts it brought in are left exactly as they are. The
        connector and the people are different things, and one control doing
        both would fight with reactivation.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LDAPSourceEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/directories/{id}/sync:
    post:
      tags: [Directories]
      operationId: syncDirectory
      summary: Read the directory now.
      description: |
        Synchronous, and answers 200 even when the run failed: the
        synchronization ran, it did not work, and `outcome` and `error` say
        so. A 500 would make a console show a generic failure instead of the
        counts and the reason.

        A directory that returns no entries at all while this source owns
        accounts fails the run and changes nothing. An empty result is far
        more often a wrong base DN or user filter than a directory everybody
        has left, and acting on it would deactivate every one of those
        accounts.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The run, successful or not.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LDAPSyncRunEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/directories/{id}/runs:
    get:
      tags: [Directories]
      operationId: listDirectoryRuns
      summary: Recent synchronizations, newest first.
      description: |
        Kept per run rather than as a last-result field, because the question
        asked after a directory integration misbehaves is not "what is the
        state now" but "when did this start".
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LDAPSyncRunListEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/organizations/{id}/manager:
    put:
      tags: [Organizations]
      operationId: setOrganizationManager
      summary: Nominate whoever is responsible for an organization.
      description: |
        **It grants nothing.** This version has two fixed roles, and being
        named here confers neither of them: it does not let the person
        administer the organization, edit its members, or do anything an
        ordinary account cannot. The field answers "who runs this department"
        for somebody reading the chart and for downstream systems that ask.

        An empty `managerId` clears the nomination.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                managerId: { type: string }
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: No such account to put in charge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /api/v1/organizations/{id}/attachments:
    post:
      tags: [Organizations]
      operationId: attachUserToOrganization
      summary: Record that somebody is involved with this organization.
      description: |
        An attachment beside a primary membership — the case of somebody in
        the platform team who also sits on a project.

        **It does not move their primary membership**, which stays the one
        authoritative answer to where they sit: the one SCIM and the
        directory sync write, and the one an export names. **And it grants
        nothing**, the same as group membership and for the same reason:
        there is no permission model here to attach it to.

        Idempotent. Attaching somebody to the organization they already
        belong to is refused rather than recorded, because two records of the
        same fact can disagree once the primary membership moves.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        "200":
          description: Attached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: |
            That account already belongs to this organization, so an
            attachment would be a second record of the same fact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /api/v1/organizations/{id}/attachments/{userID}:
    delete:
      tags: [Organizations]
      operationId: detachUserFromOrganization
      summary: Remove an attachment.
      description: |
        Idempotent: removing one that is not there succeeds, because a caller
        reconciling a list should not have to know what is already gone.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: userID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/scim-credentials:
    get:
      tags: [Provisioning]
      operationId: listSCIMCredentials
      summary: The credentials a directory provisions with.
      description: |
        No token field, and that is not an omission: only a digest is stored,
        so there is nothing to return. `tokenPrefix` is enough to tell two
        apart.
      responses:
        "200":
          description: The credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SCIMCredentialListEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Provisioning]
      operationId: createSCIMCredential
      summary: Issue a credential.
      description: |
        The token is in this response and nowhere else. It is tenant-wide and
        can create, update, and disable every account and change every
        group's membership, so issuing one is a privileged act.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: How an operator will recognize it later.
      responses:
        "200":
          description: Issued, with the token.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/IssuedSCIMCredentialEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/fields:
    get:
      tags: [Field mapping]
      operationId: listFields
      summary: Everything that may be mapped, in either direction.
      description: |
        One vocabulary serving two directions. Outbound an entry is a source —
        a fact Portico holds, to be sent under whatever name an application
        expects. Inbound it is a target — a fact a directory attribute may be
        written into.

        `inbound` is false for the entries a directory may not write, and
        `outboundOnlyBecause` then says why. Some of those are privilege
        boundaries — a directory may not set `role`, because an attribute
        granting administrator would be escalation in a system Portico does not
        own — and some are merely facts Portico owns. The reason is there so a
        reader can tell which.

        The list is the built-in half followed by this tenant's own, in a stable
        order: it is drawn as a picker, and a picker whose order changes between
        page loads is one nobody can build a habit with.
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldListEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/user-attributes:
    get:
      tags: [Field mapping]
      operationId: listUserAttributes
      summary: The attributes this tenant defined for itself.
      description: |
        Disabled ones are included. The console shows them so they can be
        enabled again, and a mapping that names one should read as "configured
        but switched off" rather than as a mapping to nothing.
      responses:
        "200":
          description: The definitions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAttributeListEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Field mapping]
      operationId: defineUserAttribute
      summary: Define an attribute.
      description: |
        For a fact SCIM's schema has no name for — a badge number, a contract
        end date, a site code. Without this the alternative is to overload
        `costCenter`.

        `key` is fixed at creation. It is what a mapping stores, so renaming it
        would silently stop a mapping that names it, in a system Portico does
        not own and cannot warn. It also has to be unique across the built-in
        catalogue as well as this tenant's own.

        How many a tenant may define is bounded, and not because of storage:
        every definition is a candidate for outbound mapping and a mapped
        attribute is bytes in every token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserAttributeRequest" }
      responses:
        "200":
          description: Defined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAttributeEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/user-attributes/{id}:
    put:
      tags: [Field mapping]
      operationId: updateUserAttribute
      summary: Change an attribute's label, kind, or ordering.
      description: |
        `key` is ignored here. See the note on creating one.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserAttributeRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAttributeEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [Field mapping]
      operationId: deleteUserAttribute
      summary: Remove an attribute and every value recorded against it.
      description: |
        Not the ordinary way to stop using one. Disabling keeps the values, and
        the values are often the answer to a question somebody asks later. This
        discards them, and the audit entry records how many went.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/user-attributes/{id}/enable:
    post:
      tags: [Field mapping]
      operationId: enableUserAttribute
      summary: Bring a retired attribute back.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAttributeEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/user-attributes/{id}/disable:
    post:
      tags: [Field mapping]
      operationId: disableUserAttribute
      summary: Retire an attribute, keeping every recorded value.
      description: |
        The ordinary way to stop using one. It stops being shown on a form and
        stops being sent; nothing recorded against it is lost.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAttributeEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{id}/attributes:
    get:
      tags: [Field mapping]
      operationId: getUserAttributeValues
      summary: One account's custom attribute values.
      description: |
        Keyed by the attribute's key rather than by its id, because the key is
        what the rest of the system refers to. Values of disabled attributes are
        absent: one that is neither shown nor sent is not part of the account as
        anybody sees it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The values.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAttributeValuesEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Field mapping]
      operationId: setUserAttributeValues
      summary: Record custom attribute values for an account.
      description: |
        A key absent from the body is left alone and an empty value clears it,
        which is the same contract the profile endpoint has: a form showing
        three of an account's attributes must not blank the ones it did not
        show.

        Clearing removes the value rather than storing an empty string, so that
        "never filled in" and "deliberately blank" stay distinguishable —
        nothing is ever sent empty, and a stored empty string would be a value
        that is configured and silently never arrives.

        Values are checked against the attribute's kind and stored in a
        canonical form: a yes/no recorded as "Yes" and another as "true" would
        otherwise reach an application as two different facts.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: string }
              example: { badge_number: "A-10293", work_mode: "HYBRID" }
      responses:
        "200":
          description: The values as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAttributeValuesEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/scim-credentials/{id}:
    delete:
      tags: [Provisioning]
      operationId: deleteSCIMCredential
      summary: Discard a credential.
      description: |
        Irreversible. Disable instead when the question is whether a sync is
        misbehaving: that can be undone, and keeps the record of it.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Discarded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/scim-credentials/{id}/enable:
    post:
      tags: [Provisioning]
      operationId: enableSCIMCredential
      summary: Let a paused integration resume.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/scim-credentials/{id}/disable:
    post:
      tags: [Provisioning]
      operationId: disableSCIMCredential
      summary: Stop a directory syncing, reversibly.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: Event subscriptions.
      responses:
        "200":
          description: The subscriptions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookListEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Subscribe an endpoint to events.
      description: |
        The signing secret is in this response and nowhere else.

        The destination must be public HTTPS. Loopback, private ranges,
        link-local — which is cloud metadata — and carrier-grade NAT are all
        refused, and the address is checked again at connection time, so a
        name that resolves publicly now and privately later does not work
        either. This is not a hardening option: it is what stops a tenant
        administrator using Portico as a proxy into the network it runs in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url, events]
              properties:
                name: { type: string }
                url: { type: string, format: uri }
                events:
                  type: array
                  items: { type: string }
                  description: |
                    Event types, or `*` for everything including types added
                    in later versions.
                headers:
                  type: object
                  additionalProperties: { type: string }
                  description: |
                    Sent with every delivery, for a receiver behind a gateway
                    that wants an API key of its own. The values are
                    credentials: they are sealed on the way in and never
                    served back, so a later read returns `headerNames` and
                    not these.
      responses:
        "200":
          description: Subscribed, with the signing secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedWebhookEnvelope" }
        "400":
          description: |
            The destination is not allowed — not HTTPS, or an address inside
            a network this server can reach privately.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/webhooks/events:
    get:
      tags: [Webhooks]
      operationId: webhookEvents
      summary: The event types this version can send.
      responses:
        "200":
          description: The event types.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StringListEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/webhooks/{id}:
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Remove a subscription.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/webhooks/{id}/deliveries:
    get:
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      summary: What was attempted, and what came back.
      description: |
        The difference between "we never sent it" and "your endpoint answered
        500 five times", without having to ask the receiver to check their
        own logs. Kept for thirty days.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The deliveries, most recent first.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/WebhookDeliveryListEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # createWebhook takes an optional `headers` object: names to values, sent
  # with every delivery for a receiver behind a gateway. Values are sealed
  # with PORTICO_ENCRYPTION_KEY and never served back — only the names are,
  # as `headerNames`. Refused with NO_ENCRYPTION_KEY where no key is
  # configured, rather than stored in the clear, and with
  # INVALID_WEBHOOK_HEADER for a name Portico sets itself, a value carrying
  # a line break, or more than ten of them.

  /api/v1/webhooks/{id}/rotate-secret:
    post:
      tags: [Webhooks]
      operationId: rotateWebhookSecret
      summary: Issue a new signing secret, keeping the old one briefly.
      description: |
        Returns the new secret once, and `previousSecretExpiresAt`: the
        moment the replaced key stops being sent.

        Until then **every delivery carries both signatures**, comma
        separated in `X-Portico-Signature`. A receiver must split on `,` and
        accept any element. One that compares the whole header as a single
        string verifies nothing for the whole overlap — and because it
        rejects rather than errors, the symptom is deliveries failing at a
        receiver that looks healthy.

        The overlap exists because Portico produces the signature and the
        receiver verifies it, so the receiver is the side with something to
        deploy. A rotation that took effect instantly would break every
        delivery until they had.

        The subscription keeps its id. Deleting and re-registering was the
        only previous remedy for a leaked key and it discarded the delivery
        history along with the receiver's deduplication.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The new secret, shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedWebhookEnvelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/webhooks/{id}/enable:
    post:
      tags: [Webhooks]
      operationId: enableWebhook
      summary: Resume a subscription.
      description: |
        Does not deliver what happened while it was paused. That is what
        pausing means.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/webhooks/{id}/disable:
    post:
      tags: [Webhooks]
      operationId: disableWebhook
      summary: Pause a subscription.
      description: Stops events being queued for it.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The token from `/api/v1/auth/login`. It carries the tenant, which is
        why authenticated requests do not take one.

        SCIM credentials are also bearer tokens but are not interchangeable
        with these: one authenticates a directory, the other a person, and
        each is refused where the other belongs.

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }
    SessionID:
      name: sessionID
      in: path
      required: true
      schema: { type: string }
    ClientID:
      name: clientID
      in: path
      required: true
      schema: { type: string }
      description: The OAuth client id, which is safe in a path segment.
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, default: 20 }
    OrganizationFilter:
      name: organizationId
      in: query
      schema: { type: string }
      description: |
        An organization **and everything under it**, rather than that one
        organization alone. This filter is reached from a chart, and picking
        a division there means the division: being shown only the handful of
        people filed directly against the division itself reads as a defect
        rather than as a distinction.

        Omit it for every organization. The reserved value `none` asks for
        the accounts that are in no organization at all — a question an
        empty value cannot ask, because an empty value already means "all".
        It cannot collide with a real organization, whose id is a UUID.

        An id naming nothing matches nobody, not everybody.
    TenantHeader:
      name: X-Portico-Tenant
      in: header
      schema: { type: string }
      description: |
        Only read where there is no token yet. On an authenticated request
        the tenant comes from the token and this header is ignored — not
        rejected, ignored, because honouring it would let one tenant's
        administrator reach every other tenant by adding a header.

        Where it is read, it comes after the `tenant` field in the body and
        before the `tenant` query parameter; if none is given, the default
        tenant answers.

  responses:
    Unauthorized:
      description: |
        No credential, or one that is not valid. Sign-in failures are
        deliberately uniform: whether the account exists is not revealed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Forbidden:
      description: Authenticated, but not an administrator of this tenant.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    NotFound:
      description: |
        No such record in this tenant. A record that exists in another tenant
        is reported the same way, because saying otherwise would confirm it
        exists.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Conflict:
      description: A unique value is already taken.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    ValidationFailed:
      description: The body was understood and is not acceptable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    TenantNotFound:
      description: |
        `TENANT_NOT_FOUND`. No tenant with that code, from the body, the
        `X-Portico-Tenant` header, or the `tenant` query parameter.

        Named rather than folded into a credential failure, because a tenant
        code is not a credential: it appears in sign-in URLs and in the
        configuration handed to everybody who uses that tenant. Concealing
        whether one exists buys nothing and costs an operator a diagnosable
        error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    TenantDisabled:
      description: |
        `TENANT_DISABLED`. The tenant exists and has been turned off, so
        nothing in it will answer until somebody turns it back on.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    DeliveryUnavailable:
      description: |
        This deployment has no way to send the message the request depends
        on — no SMTP host configured, or no SMS provider. Reported rather
        than answered with a success the caller would wait on forever.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }

  schemas:
    Envelope:
      type: object
      required: [code, message, data]
      description: |
        Every response, successful or not, has this shape. `code` is
        `SUCCESS` or a stable SCREAMING_SNAKE_CASE identifier; clients branch
        on it rather than on the message, which is prose meant for a person
        and is translated.
      properties:
        code:
          type: string
          examples: [SUCCESS, USER_NOT_FOUND]
        message:
          type: string
          description: Human-readable, and safe to show to an end user.
        data:
          description: Null when there is no result — never `{}` or `[]`.

    Role:
      type: string
      enum: [SUPER_ADMIN, USER]
      description: |
        The two fixed roles. This version has no custom roles and no
        permission assignment.
    Status:
      type: string
      enum: [ACTIVE, DISABLED]
    UserSource:
      type: string
      enum: [ADMIN, IMPORT, REGISTRATION, SCIM]
      description: |
        How an account came to exist. Three are past tense; `SCIM` is present
        tense — a directory still owns the record, and the next
        synchronization overwrites what is changed here.
    RecoveryChannel:
      type: string
      enum: [EMAIL, SMS]
    LogKind:
      type: string
      enum: [LOGIN, OPERATION, AUTH, REGISTRATION, ORGANIZATION]

    User:
      type: object
      properties:
        id: { type: string }
        tenantId:
          type: string
          description: Reported so a downstream system can keep tenants apart. Never accepted as input.
        username: { type: string }
        displayName: { type: string }
        phone: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/Status" }
        source: { $ref: "#/components/schemas/UserSource" }
        organizationId: { type: string }
        organizationName:
          type: string
          description: Resolved for display, so no client has to show a bare id.
        lockedUntil:
          type: [string, "null"]
          format: date-time
          description: Present only while a lockout is actually in force.
        closedAt:
          type: [string, "null"]
          format: date-time
          description: |
            When the account holder closed it themselves, and absent for
            every other reason an account might be disabled. The distinction
            is why the field exists: "they left" and "we suspended them" look
            identical in the status column and call for different responses.
        externalId:
          type: string
          description: |
            The identifier a provisioning system knows this account by —
            SCIM's externalId — and empty for an account created any other
            way. Reported so an administrator can see that a directory owns
            an account before wondering why their edit was overwritten by the
            next synchronization.
        profile: { $ref: "#/components/schemas/UserProfile" }
        attachments:
          type: array
          description: |
            Additional organizations this person is involved with, beside the
            one they primarily belong to. Advisory: they grant nothing and
            synchronize nowhere. Present on a single account, absent from a
            page of them — they cost a query, and the list screen does not
            ask the question.
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              code: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Organization:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        code:
          type: string
          description: |
            Used by bulk import and by downstream systems, and therefore
            fixed at creation.
        remark: { type: string }
        parentId: { type: string, description: Empty for a root. }
        status: { $ref: "#/components/schemas/Status" }
        sortOrder: { type: integer }
        managerId:
          type: string
          description: |
            Whoever is responsible for this organization. Grants nothing —
            this version has two fixed roles and being named here confers
            neither.
        managerName:
          type: string
          description: Resolved for display; ignored on write.
        userCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrganizationCreate:
      type: object
      required: [name, code]
      properties:
        name: { type: string }
        code: { type: string }
        remark: { type: string }
        parentId: { type: string }
        sortOrder: { type: integer }

    Group:
      type: object
      description: |
        A set of people. Not the organization chart: an organization is where
        somebody sits — one of them, in a tree, with a code downstream
        systems store — and a group is a set they belong to, any number of
        them, flat. Membership grants nothing.
      properties:
        id: { type: string }
        displayName: { type: string }
        description: { type: string }
        externalId:
          type: string
          description: What a directory knows it by. Empty otherwise.
        source: { type: string, enum: [ADMIN, SCIM] }
        memberCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    GroupMember:
      type: object
      properties:
        userId: { type: string }
        username: { type: string }
        displayName: { type: string }

    GroupRef:
      type: object
      description: "A group as it appears on a user: enough to name it, no more."
      properties:
        id: { type: string }
        displayName: { type: string }

    AuditLog:
      type: object
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/LogKind" }
        action: { type: string }
        result: { type: string, enum: [SUCCESS, FAILURE] }
        actorId: { type: string }
        actorName: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        targetName: { type: string }
        detail: { type: string }
        ip: { type: string }
        createdAt: { type: string, format: date-time }

    Settings:
      type: object
      properties:
        systemName: { type: string }
        registrationEnabled: { type: boolean }
        registrationVerification:
          type: boolean
          description: |
            Requires a self-registered account to confirm its email address
            or phone number before it can sign in. Turning it on is refused
            where the deployment has no way to send one.
        tokenTtlMinutes:
          type: integer
          description: The console's own session, not the OIDC tokens below.
        oidcAccessTokenTtlMinutes:
          type: integer
          description: |
            1 to 60. The ceiling is not a preference: an access token cannot
            be withdrawn once issued, so its expiry is the only thing
            bounding a permission that has been taken away.
        oidcRefreshTokenTtlDays:
          type: integer
          description: |
            1 to 90. Days rather than minutes because minutes for a
            thirty-day value is a number nobody reads at a glance.
        oidcSessionMaxAgeDays:
          type: integer
          description: |
            Caps the whole refresh chain, measured from the sign-in that
            began it, however diligently it is refreshed. Zero — the default
            — means no cap.
        showGuides:
          type: boolean
          description: |
            Offers the explanatory panel on each administrative screen. A
            tenant that has trained its administrators can turn them off.
        lockoutThreshold:
          type: integer
          description: |
            Consecutive failed sign-ins that lock an account. Zero switches
            lockout off.
        lockoutDurationMinutes: { type: integer }
        passwordMinLength:
          type: integer
          description: Has a floor no policy can go below.
        passwordRequireUppercase: { type: boolean }
        passwordRequireLowercase: { type: boolean }
        passwordRequireDigit: { type: boolean }
        passwordRequireSymbol: { type: boolean }
        passwordHistoryDepth:
          type: integer
          description: Previous passwords that may not be reused. 0 does not check.
        passwordMaxAgeDays:
          type: integer
          description: 0 never expires.
        auditRetentionDays:
          type: integer
          description: |
            0 — the default — keeps entries forever, which is the only safe
            default: the trail is the record of what happened, not an
            operational buffer.
        defaultLocale:
          type: string
          enum: ["", "en-US", "zh-CN"]
          description: |
            The language of messages this tenant sends — a reset link, a
            confirmation — to somebody who has stated no preference of their
            own. It does not affect the console, which each reader chooses
            for themselves.

            An empty string means "follow the deployment's
            PORTICO_DEFAULT_LOCALE", and is the default. It is a real value
            rather than an absence: a tenant that has said nothing should
            follow whatever the deployment is changed to later, rather than
            having been frozen at whatever it was on the day the tenant was
            created.

            A tag this build has no messages for is refused with
            INVALID_SETTINGS rather than stored, because a stored setting
            that silently does nothing is worse than one that would not save.

    Session:
      type: object
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }

    UserSession:
      type: object
      description: |
        One sign-in, as shown to the person it belongs to. There is no token
        and never will be: the server stores a digest, so there is nothing
        here to leak.
      properties:
        id: { type: string }
        ip: { type: string }
        userAgent: { type: string }
        current:
          type: boolean
          description: The session making this request.
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    ImportResult:
      type: object
      properties:
        total: { type: integer }
        imported: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              username: { type: string }
              code: { type: string }
              message: { type: string }

    RegistrationStatus:
      type: object
      properties:
        registrationEnabled: { type: boolean }
        registrationVerification:
          type: boolean
          description: |
            Requires a self-registered account to confirm its email address
            or phone number before it can sign in. Turning it on is refused
            where the deployment has no way to send one.
        systemName: { type: string }
        tenant: { type: string }
        tenantName: { type: string }

    Authorization:
      type: object
      description: |
        Where a browser goes once somebody has signed in. The destination is
        the provider's own callback, not the application's: the code is
        issued there and redirected onward.
      properties:
        redirectTo: { type: string, format: uri }
        clientName: { type: string, description: On the OAuth path. }
        serviceProviderName: { type: string, description: On the SAML path. }
        serviceName: { type: string, description: On the CAS path. }

    OAuthClient:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        clientId: { type: string }
        name: { type: string }
        launchUrl:
          type: string
          description: |
            Where a person opens this application, for the portal. Empty when
            none was given. Not a redirect URI: that is where a code is
            delivered mid-flow, and opening it directly produces an error.
        logoUri:
          type: string
          description: |
            The picture on this application's portal tile. Empty when none
            was given, in which case the tile carries the first character of
            the name.
        confidential:
          type: boolean
          description: |
            False for a browser or mobile application, which cannot keep a
            secret and authenticates with PKCE alone.
        applicationType: { type: string, enum: [WEB, NATIVE, USER_AGENT] }
        authMethod: { type: string }
        redirectUris: { type: array, items: { type: string } }
        postLogoutRedirectUris: { type: array, items: { type: string } }
        grantTypes: { type: array, items: { type: string } }
        scopes: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/Status" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RegisteredClient:
      type: object
      description: |
        A client together with a freshly generated secret. The secret appears
        on exactly two responses — registration and rotation — and is never
        readable afterwards, because only a hash is stored.
      properties:
        client: { $ref: "#/components/schemas/OAuthClient" }
        secret:
          type: string
          description: Absent for a public client, which has none.

    SAMLServiceProvider:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        entityId: { type: string }
        name: { type: string }
        launchUrl: { type: string }
        logoUri: { type: string }
        acsUrls:
          type: array
          items: { type: string }
          description: Read out of the metadata document rather than typed in.
        status: { $ref: "#/components/schemas/Status" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CASService:
      type: object
      properties:
        id: { type: string }
        tenantId: { type: string }
        name: { type: string }
        urlPrefix: { type: string }
        launchUrl: { type: string }
        logoUri: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PortalApplication:
      type: object
      description: |
        One thing a person can open. Deliberately not the administrative
        shape: a reader does not need redirect URIs or a metadata document,
        which are how the protocol works rather than what the application is.
      properties:
        name: { type: string }
        protocol: { $ref: "#/components/schemas/Protocol" }
        launchUrl: { type: string, format: uri }
        logoUri:
          type: string
          description: |
            Empty when none was registered. The screen falls back to a
            lettered tile rather than to a broken image, so absence here is a
            normal answer.

    Protocol:
      type: string
      enum: [oauth, saml, cas]

    IntegrationEndpoints:
      type: object
      properties:
        tenantCode: { type: string }
        issuer: { type: string, format: uri }
        oidc:
          type: object
          properties:
            discovery: { type: string, format: uri }
            authorize: { type: string, format: uri }
            token: { type: string, format: uri }
            userinfo: { type: string, format: uri }
            jwks: { type: string, format: uri }
            endSession: { type: string, format: uri }
            introspect: { type: string, format: uri }
            revoke: { type: string, format: uri }
        saml:
          type: object
          properties:
            entityId: { type: string }
            metadata: { type: string, format: uri }
            sso: { type: string, format: uri }
            certificatePem: { type: string }
        cas:
          type: object
          properties:
            baseUrl: { type: string, format: uri }
            login: { type: string, format: uri }
            logout: { type: string, format: uri }
            serviceValidate: { type: string, format: uri }

    SCIMCredential:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        tokenPrefix:
          type: string
          description: The first characters, enough to tell two apart.
        status: { $ref: "#/components/schemas/Status" }
        lastUsedAt:
          type: [string, "null"]
          format: date-time
          description: |
            Null until a directory has used it. The question asked when a
            sync has quietly stopped.
        createdAt: { type: string, format: date-time }

    IssuedSCIMCredential:
      allOf:
        - $ref: "#/components/schemas/SCIMCredential"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Present on creation and never again.

    WebhookSubscription:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string, format: uri }
        events: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/Status" }
        createdAt: { type: string, format: date-time }
        headerNames:
          type: array
          items: { type: string }
          description: |
            The names of the headers this subscription sends, without their
            values. The values are credentials, and an endpoint serving them
            back would be a way to read every bearer token the tenant has
            stored — which is what sealing them was for. The names are enough
            to answer "what is this subscription sending".

    CreatedWebhookSubscription:
      allOf:
        - $ref: "#/components/schemas/WebhookSubscription"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: |
                Present on creation and never again. Stored in the clear
                because it signs rather than authenticates — there is nothing
                to compare a digest against — which is exactly why no
                endpoint serves it a second time.
            previousSecretExpiresAt:
              type: string
              format: date-time
              description: |
                When the key this replaced stops being sent, and absent on a
                first issue because there was nothing it replaced.

                It is the receiver's deadline rather than this server's, and
                the one number they have to act on: until then every delivery
                carries both signatures.

    WebhookDelivery:
      type: object
      properties:
        id: { type: string }
        eventType: { type: string }
        status: { type: string, enum: [PENDING, DELIVERED, FAILED] }
        attempts: { type: integer }
        lastStatus:
          type: [integer, "null"]
          description: Null when the request never reached a server at all.
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        deliveredAt: { type: [string, "null"], format: date-time }

    # --- Envelopes -----------------------------------------------------
    # One per payload shape. Verbose, and the alternative is a document that
    # says every response is an object with a `data` field of unknown type,
    # which is not a contract a generator can do anything with.

    HealthEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                status: { type: string }
                version: { type: string }

    ReadinessEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                status: { type: string }
                version: { type: string }
                database: { type: string }

    MessageEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                message: { type: string }

    ReauthenticationEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                reauthenticationRequired:
                  type: boolean
                  description: |
                    True when the change ended the calling session, which a
                    password change always does.

    PrincipalEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                userId: { type: string }
                tenantId: { type: string }
                username: { type: string }
                role: { $ref: "#/components/schemas/Role" }
                isAdmin: { type: boolean }

    RecoveryChannelsEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                channels:
                  type: array
                  items: { $ref: "#/components/schemas/RecoveryChannel" }
                  description: |
                    Empty when the deployment has neither a mail relay nor an
                    SMS provider.
                tokenTtlMinutes:
                  type: integer
                  description: How long a reset link stays valid.

    StringListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { type: array, items: { type: string } }

    SessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Session" }

    UserEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/User" }

    Me:
      description: |
        The caller's own account, plus the one fact about it they cannot see
        anywhere else. A superset of User, so a client written against that
        keeps working.
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            passwordExpiresAt:
              type: string
              format: date-time
              description: |
                When this password stops working. Absent when passwords do
                not expire in this tenant. The instant, not the policy: the
                policy is administrator-only, and somebody does not need to
                be told the rules to be told their own deadline.

    MeEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Me" }

    BulkResult:
      type: object
      description: |
        What a bulk request did, per account. The outcomes are individual
        because the failures are: an operator needs to know *which* account
        was the last administrator, not that "it failed".
      properties:
        total: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        outcomes:
          type: array
          items:
            type: object
            properties:
              userId: { type: string }
              code:
                type: string
                description: Empty on success; the error code otherwise.
              message: { type: string }

    BulkResultEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/BulkResult" }

    UserProfile:
      type: object
      description: |
        The descriptive half of an account: everything that says who somebody
        is rather than what they may do.

        The field names come from SCIM 2.0's core User schema (RFC 7643 §4.1)
        and its enterprise extension (§4.3), so a directory's attributes land
        where they belong and the meaning of each is settled by that
        specification rather than by this project.

        Every field is optional; an account with only a username and a
        display name is complete. SCIM's `organization` and `division` are
        deliberately absent — this system has an organization tree, and a
        hand-typed string beside it drifts.
      properties:
        nameFormatted: { type: string }
        familyName: { type: string }
        givenName: { type: string }
        middleName: { type: string }
        honorificPrefix: { type: string }
        honorificSuffix: { type: string }
        nickName: { type: string }
        profileUrl: { type: string }
        photoUrl: { type: string }
        title: { type: string }
        userType: { type: string }
        preferredLanguage: { type: string }
        locale: { type: string }
        timezone: { type: string }
        addressFormatted: { type: string }
        streetAddress: { type: string }
        locality: { type: string }
        region: { type: string }
        postalCode: { type: string }
        country: { type: string }
        employeeNumber:
          type: string
          description: |
            Unique within the tenant where set. It is how an HR system names
            a person, so two accounts claiming one is a reconciliation error
            rather than something to store.
        costCenter: { type: string }
        department:
          type: string
          description: |
            Free text as a directory sends it, and distinct from
            `organizationId`. A directory often sends a name that
            corresponds to nothing in this tenant's tree; keeping both loses
            nothing and lets an operator place the person later.
        managerId:
          type: string
          description: Who this person reports to. Empty for nobody.
        managerName:
          type: string
          description: Resolved for display; ignored on write.

    LDAPSource:
      type: object
      description: |
        A directory Portico reads accounts out of. The bind password is
        absent by construction — the type has no field for it, so there is no
        shape in which a forgotten annotation could leak one.
      properties:
        id: { type: string }
        tenantId: { type: string }
        name: { type: string }
        host: { type: string }
        port: { type: integer }
        encryption: { type: string, enum: [none, starttls, tls] }
        bindDn:
          type: string
          description: Empty means an anonymous bind.
        hasBindPassword:
          type: boolean
          description: |
            Whether a credential is stored. What a form needs in order to
            show "set" and offer to replace, without the value being sent.
        baseDn: { type: string }
        userFilter: { type: string }
        attrUsername: { type: string }
        attrDisplayName: { type: string }
        attrEmail: { type: string }
        attrPhone: { type: string }
        attrExternalId:
          type: string
          description: |
            The reconciliation key's source attribute — objectGUID on Active
            Directory, entryUUID on OpenLDAP.
        organizationId: { type: string }
        organizationName: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        syncIntervalMinutes:
          type: integer
          description: |
            How often this directory is synchronized without anybody asking.
            Zero means never, and is the default.
        lastSyncedAt:
          type: string
          format: date-time
          description: |
            Absent until the first run **succeeds**. A scheduled run that
            failed advances the schedule without touching this, so it stays the
            answer to "is this directory still working" rather than "did
            something try recently".
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LDAPSourceRequest:
      type: object
      required: [host, baseDn, userFilter, attrUsername, attrDisplayName, attrExternalId]
      properties:
        name: { type: string }
        host:
          type: string
          description: The host name alone. Scheme, path, and port are refused here.
        port: { type: integer, description: "Defaults to 389, or 636 for tls." }
        encryption: { type: string, enum: [none, starttls, tls] }
        bindDn: { type: string }
        bindPassword:
          type: string
          description: |
            Write-only. Omit it to leave the stored credential alone; send an
            empty string to clear it. Storing one requires the deployment to
            have PORTICO_ENCRYPTION_KEY set — otherwise the request is
            refused rather than the value being written in the clear.
        baseDn: { type: string }
        userFilter: { type: string }
        attrUsername: { type: string }
        attrDisplayName: { type: string }
        attrEmail: { type: string }
        attrPhone: { type: string }
        attrExternalId: { type: string }
        organizationId:
          type: string
          description: Where synchronized accounts land. Optional.
        syncIntervalMinutes:
          type: integer
          description: |
            Synchronize automatically this often. Omit it, or send 0, for no
            automatic synchronization — which is the default, so upgrading
            does not start reading a directory on a timer.

            Otherwise between 15 and 10080 (seven days), and refused outside
            that range rather than clamped. The floor exists because a
            synchronization has only one size: working out who has left the
            directory means listing everybody in it.

            Turning it on synchronizes promptly rather than one interval
            later. Scheduled runs carry no `actorName`.

    LDAPSyncRun:
      type: object
      properties:
        id: { type: string }
        sourceId: { type: string }
        actorName:
          type: string
          description: Empty for the scheduler, which is not a person.
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        outcome: { type: string, enum: [RUNNING, SUCCEEDED, FAILED] }
        createdCount: { type: integer }
        updatedCount: { type: integer }
        deactivatedCount: { type: integer }
        skippedCount:
          type: integer
          description: |
            Entries the directory returned that could not become an account —
            no username, no external id, or a username an account this source
            does not own already holds. Counted rather than fatal.
        skippedDetail:
          type: string
          description: |
            Why they were skipped, grouped by reason with an example of each —
            "5 × That is not a valid phone number. (mei, arjun, …); 1 ×
            That username is already taken. (admin)". Empty when nothing was
            skipped.

            The count alone is not usable: it sends an operator to the
            documentation, which says a skip is most often a username
            collision, and that is a wrong lead whenever it is not one.

            Bounded on purpose — three examples per reason, five reasons — so
            that a source pointed at the wrong attribute produces a sentence
            rather than a row per account in the directory.
        errorCode:
          type: string
          description: |
            Set when Portico refused, empty when the directory reported the
            failure. A client renders a known code in the reader's language;
            anything else is the LDAP server's own wording and should be
            shown verbatim, because that is the string an operator will
            search for.
        error: { type: string }

