# Keep the free-tier demonstration awake.
#
# Render spins a free web service down after 15 minutes without inbound
# traffic, and the next visitor waits out a cold start. This asks it for its
# health endpoint, often, during the hours somebody is likely to arrive.
#
# What this is not: a fix, and the first version of this comment understated
# by how much. It said the scheduler "runs late" and guessed 20 minutes.
# Measured on this repository over one ordinary day: 12 runs against the 66
# the cron below asks for, shortest gap 27 minutes, longest 69 — not one of
# them inside the 15 this is trying to stay under. The next morning the
# window opened at 00:03 UTC and nothing had fired by 00:52.
#
# So it does not keep the service awake. It raises the chance that a visitor
# during the working day meets a warm one, which is worth having for free and
# is not the same claim. The honest fixes are Render's $7/month tier, or an
# external probe on a five-minute interval — that one fits inside the 15, at
# the price of another account and another credential. docs/integrations.md
# says the same to whoever is deciding, and README tells a visitor plainly
# that the first request may wait out a cold start.
#
# Free for this repository: Actions minutes are unmetered on public
# repositories, so the only cost is the noise in the run list.
#
# It runs during the working day only, and that is not a saving of Actions
# minutes — those are free — but of Render's. A free workspace gets 750
# instance hours a calendar month and a service kept awake around the clock
# spends about 730 of them: it works, and it works by consuming very nearly
# the whole allowance, leaving nothing for a second free service and no margin
# for a month with a redeploy in it. Eleven hours a day is roughly 340, which
# is the same demonstration for less than half the budget.
#
# Turning it off: set the repository variable DEMO_KEEPALIVE to `off`. The
# schedule then does nothing until it is removed. Running it by hand still
# works — checking whether the demo is up is the one thing you want while the
# keepalive is off. Disabling the workflow in the Actions tab stops both.
name: Demo keepalive

on:
  schedule:
    # 00:03–10:53 UTC, every ten minutes, offset off the hour because
    # scheduled jobs across GitHub pile onto :00 and that is exactly when the
    # scheduler is slowest.
    #
    # GitHub cron is UTC and says so nowhere in a run's output, which makes a
    # window like this the easiest thing in the file to get quietly wrong. In
    # +08 this is 08:03–18:53, for a demonstration meant to be awake from 09
    # to 19. Somewhere else, move the hours; the minutes can stay.
    #
    # It starts an hour early on purpose. A first poke at 09:03 would leave
    # whoever arrives at 09:00 waiting out precisely the cold start this
    # exists to prevent, so the warming happens before the day does.
    - cron: "3,13,23,33,43,53 0-10 * * *"
  # For checking by hand whether the address is up at all.
  workflow_dispatch:

# One at a time. A backlog of pokes after an outage would all arrive at once
# and tell us nothing extra.
concurrency:
  group: demo-keepalive
  cancel-in-progress: true

permissions: {}

jobs:
  poke:
    runs-on: ubuntu-latest
    # A cold start on the free tier can take most of a minute, and the
    # request that triggers it is the one that waits. Nothing here should
    # ever approach this; it exists so a hung request cannot hold a runner.
    timeout-minutes: 5
    steps:
      # DEMO_URL is a variable rather than a secret: it is a public address,
      # and a secret would be redacted out of the logs that are the only
      # thing this job produces. Set it under Settings → Actions → Variables.
      - name: Ask the demo for its health
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
          DEMO_KEEPALIVE: ${{ vars.DEMO_KEEPALIVE }}
          # Whether this run was asked for by a person. The switch below is
          # for the schedule; somebody who came here and pressed the button
          # wants an answer, and "the keepalive is off" is not one.
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # The off switch. Unset means on, so a repository that never heard
          # of this variable behaves as it always did — and `on` means on too,
          # since somebody setting it that way meant the obvious thing.
          case "$(printf %s "$DEMO_KEEPALIVE" | tr '[:upper:]' '[:lower:]')" in
            off | false | 0 | no)
              if [ "$BY_HAND" != "true" ]; then
                echo "DEMO_KEEPALIVE=$DEMO_KEEPALIVE — the schedule is off."
                echo "Remove the variable to turn it back on. Running this"
                echo "workflow by hand still checks the demo."
                exit 0
              fi
              echo "DEMO_KEEPALIVE=$DEMO_KEEPALIVE, but this run was asked"
              echo "for by hand — checking anyway."
              ;;
          esac

          # Not an error. This runs every ten minutes on every fork of this
          # repository, and most of them publish no demo — failing there would
          # be a red cross every ten minutes for something nobody asked for,
          # which is how a repository teaches people to ignore its Actions
          # tab. Nothing to poke is nothing to do.
          if [ -z "$DEMO_URL" ]; then
            echo "DEMO_URL is not set — no demo to keep awake."
            echo "To publish one, see docs/access-guide.md."
            exit 0
          fi

          # --max-time generously: this request is often the one paying for
          # the cold start, and treating that as a failure would report an
          # outage every time the service had been asleep — the one case
          # where it worked exactly as intended.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 \
            "${DEMO_URL%/}/api/v1/health") || code=000

          echo "GET ${DEMO_URL%/}/api/v1/health -> $code"

          # 200 only. A 502 from Render's edge means the instance is not
          # answering, which is worth a red run rather than a quiet pass.
          [ "$code" = "200" ]
