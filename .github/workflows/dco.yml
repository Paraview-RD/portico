name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# CONTRIBUTING.md says commits without a sign-off will not be merged. This is
# what makes that true rather than aspirational.
#
# Written as a shell script rather than a third-party action on purpose: it is
# a merge gate on an authentication project, so it should not depend on code
# outside this repository.
jobs:
  check:
    name: Check sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need both branches to enumerate exactly the commits this PR adds.
          fetch-depth: 0

      - name: Every commit must carry a Signed-off-by trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          commits=$(git rev-list "$BASE".."$HEAD")
          if [ -z "$commits" ]; then
            echo "No commits to check."
            exit 0
          fi

          failed=0
          for sha in $commits; do
            subject=$(git log -1 --format='%s' "$sha")

            # Merge commits are generated by GitHub and cannot be signed off
            # by the contributor.
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then
              echo "skip   $(git rev-parse --short "$sha")  $subject  (merge commit)"
              continue
            fi

            author="$(git log -1 --format='%an <%ae>' "$sha")"
            # Compare case-insensitively on the trailer name only; the value
            # must match the commit author exactly.
            if git log -1 --format='%B' "$sha" \
                 | grep -qiE "^Signed-off-by: $(printf '%s' "$author" | sed 's/[][\.*^$(){}?+|/]/\\&/g')$"; then
              echo "ok     $(git rev-parse --short "$sha")  $subject"
            else
              echo "FAIL   $(git rev-parse --short "$sha")  $subject"
              echo "       expected trailer: Signed-off-by: $author"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            cat <<'EOF'

          One or more commits are missing a Developer Certificate of Origin
          sign-off, or the sign-off does not match the commit author.

          To fix the most recent commit:

              git commit --amend -s --no-edit
              git push --force-with-lease

          To fix every commit in this branch:

              git rebase --signoff origin/main
              git push --force-with-lease

          Sign new commits automatically with `git commit -s`.
          See CONTRIBUTING.md for the certification you are agreeing to.
          EOF
            exit 1
          fi

          echo
          echo "All commits are signed off."
