name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release and upload artifacts
  packages: write # push the image to GHCR
  id-token: write # keyless signing via Sigstore; no stored private key

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser needs the full history to resolve the previous tag.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The frontend is compiled into the binary, so its toolchain has to be
      # present before GoReleaser runs its `before` hooks.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # And the manual, for the same reason. Without this the hook that builds
      # it cannot run, and the release embeds an empty directory — which is
      # what every release before this one did.
      - uses: actions/setup-python@v5
      - run: pip install -r hack/docs-requirements.txt

      # Refuse to publish a tag that does not pass the same gates as a PR.
      - name: Verify before releasing
        run: |
          go vet ./...
          go test ./...

      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
