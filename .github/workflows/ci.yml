name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portico
          POSTGRES_PASSWORD: portico
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portico"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Point the test helper at the service container rather than having it
      # start one of its own.
      PORTICO_TEST_DB_DSN: postgres://portico:portico@localhost:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^internal/store/sqlcgen/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go test -race ./...

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npx prettier --check "src/**/*.{ts,tsx,css}"
      - run: npm run lint
      - run: npm run build

      # A known-vulnerable dependency should fail the build, not sit in the
      # lockfile until someone happens to run audit locally.
      - run: npm audit --audit-level=high

  # The end-to-end check: the frontend must actually compile into the binary,
  # which is the shape users deploy.
  single-binary:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portico
          POSTGRES_PASSWORD: portico
          POSTGRES_DB: portico
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portico"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: CGO_ENABLED=0 go build -o portico ./cmd/server

      - name: Smoke test the built binary
        run: |
          PORTICO_ADDR=:8410 \
          PORTICO_DB_DSN='postgres://portico:portico@localhost:5432/portico?sslmode=disable' \
          PORTICO_JWT_SECRET=$(openssl rand -hex 32) \
          PORTICO_INITIAL_ADMIN_PASSWORD=ci-admin-password ./portico &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8410/api/v1/health && break
            sleep 1
          done
          # The API answers...
          curl -sf http://localhost:8410/api/v1/health | grep -q '"status":"ok"'
          # ...and the embedded UI is really in there.
          curl -sf http://localhost:8410/ | grep -qi '<div id="root">'
