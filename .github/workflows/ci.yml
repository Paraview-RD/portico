name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, so that the race detector still sees every package on a
  # schedule of its own rather than only when somebody happens to merge.
  # See the two test steps below for why it does not run on a pull request.
  #
  # Not on the hour: that is when everybody else's schedules fire, and a
  # queued run is a run nobody reads in the morning.
  schedule:
    - cron: "37 18 * * *"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portico
          POSTGRES_PASSWORD: portico
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portico"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Point the test helper at the service container rather than having it
      # start one of its own.
      PORTICO_TEST_DB_DSN: postgres://portico:portico@localhost:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^internal/store/sqlcgen/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # The manual, built before the tests that read it.
      #
      # internal/docs serves the site out of the binary, and its tests skip
      # themselves when it has not been built — which in this job was always.
      # So five tests announced themselves as passing by never running, and
      # one of them had been failing on main for days: it asserted on a
      # sentence somebody had since reworded, and only a developer who had
      # run hack/dev.sh ever saw it. A test that cannot fail in CI is not a
      # test CI has, and the skip made that indistinguishable from a green.
      #
      # Here rather than in the docs job, which builds the same site: this is
      # where Go tests that read the documentation live, and there are
      # several. Splitting these four out would leave `go test ./...` here
      # still skipping them, and the next one somebody adds would go quiet
      # the same way. Half a minute on a job that already runs a
      # twenty-five-minute race build.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r hack/docs-requirements.txt
      - run: ./hack/build-docs.sh

      # The suite runs twice over, in two places, and the difference is the
      # race detector.
      #
      # It is what makes this job long. Measured on one machine, on the
      # package that dominates the suite: `internal/server` takes 98 seconds
      # without the detector and 614 with it — six times over, and most of
      # the wait on every pull request. Including the ones that change a line
      # of Markdown: several Go tests read the documentation, so no path
      # filter can skip this job for them.
      #
      # A race is not something a pull request introduces and a merge fixes,
      # so checking it once per merge rather than once per push costs
      # detection latency and nothing else. What it costs is real, though:
      # a race now lands on main and is reported minutes later instead of
      # blocking the pull request that carried it. The nightly run above is
      # the second net, so a race merged on a quiet afternoon is named before
      # the next morning rather than at whatever unrelated merge comes next.
      #
      # -timeout, because the default is ten minutes and 614 seconds is over
      # it. That is not a margin, it is a coin toss: the same commit passes
      # or panics with `test timed out` depending on how loaded the runner
      # is, and the panic names whichever test was unlucky enough to be
      # running rather than the clock. Kept on both steps, since a timeout
      # only costs anything once something has already hung.
      - name: Tests
        if: github.event_name == 'pull_request'
        run: go test -timeout 25m ./...

      - name: Tests, with the race detector
        if: github.event_name != 'pull_request'
        run: go test -race -timeout 25m ./...

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npx prettier --check "src/**/*.{ts,tsx,css}"
      - run: npm run lint

      # Component tests. They do not replace the browser pass — a
      # Content-Security-Policy that blocks the page passes a jsdom test just
      # as happily as it passed eleven Go tests — but they hold the things a
      # browser shows once and nobody rechecks: that a control points at the
      # right identifier, that a toggle reports its state, that an error
      # renders in the reader's language.
      - run: npm test

      - run: npm run build

      # A known-vulnerable dependency should fail the build, not sit in the
      # lockfile until someone happens to run audit locally.
      - run: npm audit --audit-level=high

  # The OpenAPI document is checked twice, for two different failures.
  #
  # A Go test walks the router and asserts the document and the routes agree,
  # which catches an endpoint added without being described and a path
  # described without existing. It cannot catch a document that is not valid
  # OpenAPI — it only reads paths and operation ids, so a dangling $ref or a
  # malformed schema passes it happily and then breaks every generator.
  # That is this job.
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Pinned rather than @latest: a linter that changes under the build
      # turns somebody else's release into a failure on an unrelated pull
      # request.
      - run: npx --yes @redocly/cli@2.4.0 lint docs/api/openapi.yaml

  # The manual, built the way it is built for a release.
  #
  # The site is the lesser half of what this catches. --strict turns a dead
  # link into a failed build, and these pages reference each other densely
  # enough that a rename otherwise breaks several of them silently — the
  # first run of this found two links pointing outside the published site,
  # both of which worked on GitHub and would have 404'd for every reader of
  # the shipped manual.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned, for the same reason the OpenAPI linter is: a theme that
      # changes under the build turns somebody else's release into a failure
      # on an unrelated pull request.
      - run: pip install -r hack/docs-requirements.txt
      - run: ./hack/build-docs.sh
      # And the published copy, which is the same source through a different
      # config and can break on its own — a bad site_url, an override that
      # reads a flag only this build sets. The workflow that publishes it
      # runs on main and therefore after the merge, so without this line the
      # first sign of a break is a red deployment on a branch nobody can fix
      # without another pull request.
      - run: mkdocs build -f mkdocs.pages.yml --strict
      # Report-only, deliberately. Translation lands in batches, and failing
      # the build on the first untranslated page would mean no batch could
      # ever be merged — the check exists to make the remainder visible, not
      # to block it.
      - run: ./hack/untranslated.sh

  # The end-to-end check: the frontend must actually compile into the binary,
  # which is the shape users deploy.
  single-binary:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portico
          POSTGRES_PASSWORD: portico
          POSTGRES_DB: portico
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portico"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      # The manual, for the same reason the frontend is built here: both are
      # compiled into the binary, and a browser test against a binary missing
      # one of them is a test of something nobody runs.
      #
      # It was missing, and that is why /docs could ship broken. The browser
      # suite exists to catch what only a browser enforces, and it was
      # exercising a binary whose internal/docs/site held one .gitkeep — so
      # even a test that visited /docs would have been reading "the manual
      # was not included in this build" and asserting nothing about the
      # manual. Pinned to the same versions as the docs job; two builds of
      # the same site from different Material releases are two different
      # sites.
      - uses: actions/setup-python@v5
      - run: pip install -r hack/docs-requirements.txt
      - run: ./hack/build-docs.sh

      - run: CGO_ENABLED=0 go build -o portico ./cmd/server

      - name: Smoke test the built binary
        run: |
          PORTICO_ADDR=:8410 \
          PORTICO_DB_DSN='postgres://portico:portico@localhost:5432/portico?sslmode=disable' \
          PORTICO_JWT_SECRET=$(openssl rand -hex 32) \
          PORTICO_INITIAL_ADMIN_PASSWORD=ci-admin-password ./portico &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8410/api/v1/health && break
            sleep 1
          done
          # The API answers...
          curl -sf http://localhost:8410/api/v1/health | grep -q '"status":"ok"'
          # ...and the embedded UI is really in there.
          curl -sf http://localhost:8410/ | grep -qi '<div id="root">'
          # ...and so is the manual, which is the assertion that was missing.
          # The line above has existed since the UI was embedded; the same
          # sentence about the manual was never written, so a binary built
          # without it passed every gate and shipped. `-f` is not enough on
          # its own here: a manual that was not built answers 404, which curl
          # would fail on, but a half-built one would not — so this looks for
          # something only a rendered page has.
          curl -sf http://localhost:8410/docs/ | grep -q 'md-content'

      # Browser tests, against the binary built above — which is the point.
      # A Content-Security-Policy is set by Go middleware and enforced only
      # by a browser: the component tests and eleven Go tests all passed
      # while a policy blocked every SAML sign-in. Running these against the
      # dev server would reproduce that blind spot exactly.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      # Its own database, not the smoke test's. The initial administrator is
      # created once per database and never has its password changed
      # afterwards, so a shared one would leave these tests signing in with
      # the wrong password against an account created by the step above.
      - name: Create the browser-test database
        run: psql "$DSN" -c 'CREATE DATABASE portico_e2e'
        env:
          DSN: postgres://portico:portico@localhost:5432/portico?sslmode=disable

      - name: Browser tests
        run: npm run e2e
        working-directory: web
        env:
          PORTICO_E2E_DB_DSN: postgres://portico:portico@localhost:5432/portico_e2e?sslmode=disable

      - uses: actions/upload-artifact@v4
        # Traces and screenshots are kept only for a failure, and are the
        # difference between "a browser test failed" and knowing why without
        # reproducing it locally.
        if: failure()
        with:
          name: playwright-report
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
