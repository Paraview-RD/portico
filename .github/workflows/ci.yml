name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portico
          POSTGRES_PASSWORD: portico
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portico"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Point the test helper at the service container rather than having it
      # start one of its own.
      PORTICO_TEST_DB_DSN: postgres://portico:portico@localhost:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^internal/store/sqlcgen/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go test -race ./...

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npx prettier --check "src/**/*.{ts,tsx,css}"
      - run: npm run lint

      # Component tests. They do not replace the browser pass — a
      # Content-Security-Policy that blocks the page passes a jsdom test just
      # as happily as it passed eleven Go tests — but they hold the things a
      # browser shows once and nobody rechecks: that a control points at the
      # right identifier, that a toggle reports its state, that an error
      # renders in the reader's language.
      - run: npm test

      - run: npm run build

      # A known-vulnerable dependency should fail the build, not sit in the
      # lockfile until someone happens to run audit locally.
      - run: npm audit --audit-level=high

  # The OpenAPI document is checked twice, for two different failures.
  #
  # A Go test walks the router and asserts the document and the routes agree,
  # which catches an endpoint added without being described and a path
  # described without existing. It cannot catch a document that is not valid
  # OpenAPI — it only reads paths and operation ids, so a dangling $ref or a
  # malformed schema passes it happily and then breaks every generator.
  # That is this job.
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Pinned rather than @latest: a linter that changes under the build
      # turns somebody else's release into a failure on an unrelated pull
      # request.
      - run: npx --yes @redocly/cli@2.4.0 lint docs/api/openapi.yaml

  # The manual, built the way it is built for a release.
  #
  # The site is the lesser half of what this catches. --strict turns a dead
  # link into a failed build, and these pages reference each other densely
  # enough that a rename otherwise breaks several of them silently — the
  # first run of this found two links pointing outside the published site,
  # both of which worked on GitHub and would have 404'd for every reader of
  # the shipped manual.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned, for the same reason the OpenAPI linter is: a theme that
      # changes under the build turns somebody else's release into a failure
      # on an unrelated pull request.
      - run: pip install mkdocs-material==9.5.44 mkdocs-static-i18n==1.3.1
      - run: ./hack/build-docs.sh
      # Report-only, deliberately. Translation lands in batches, and failing
      # the build on the first untranslated page would mean no batch could
      # ever be merged — the check exists to make the remainder visible, not
      # to block it.
      - run: ./hack/untranslated.sh

  # The end-to-end check: the frontend must actually compile into the binary,
  # which is the shape users deploy.
  single-binary:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portico
          POSTGRES_PASSWORD: portico
          POSTGRES_DB: portico
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portico"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: CGO_ENABLED=0 go build -o portico ./cmd/server

      - name: Smoke test the built binary
        run: |
          PORTICO_ADDR=:8410 \
          PORTICO_DB_DSN='postgres://portico:portico@localhost:5432/portico?sslmode=disable' \
          PORTICO_JWT_SECRET=$(openssl rand -hex 32) \
          PORTICO_INITIAL_ADMIN_PASSWORD=ci-admin-password ./portico &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8410/api/v1/health && break
            sleep 1
          done
          # The API answers...
          curl -sf http://localhost:8410/api/v1/health | grep -q '"status":"ok"'
          # ...and the embedded UI is really in there.
          curl -sf http://localhost:8410/ | grep -qi '<div id="root">'

      # Browser tests, against the binary built above — which is the point.
      # A Content-Security-Policy is set by Go middleware and enforced only
      # by a browser: the component tests and eleven Go tests all passed
      # while a policy blocked every SAML sign-in. Running these against the
      # dev server would reproduce that blind spot exactly.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      # Its own database, not the smoke test's. The initial administrator is
      # created once per database and never has its password changed
      # afterwards, so a shared one would leave these tests signing in with
      # the wrong password against an account created by the step above.
      - name: Create the browser-test database
        run: psql "$DSN" -c 'CREATE DATABASE portico_e2e'
        env:
          DSN: postgres://portico:portico@localhost:5432/portico?sslmode=disable

      - name: Browser tests
        run: npm run e2e
        working-directory: web
        env:
          PORTICO_E2E_DB_DSN: postgres://portico:portico@localhost:5432/portico_e2e?sslmode=disable

      - uses: actions/upload-artifact@v4
        # Traces and screenshots are kept only for a failure, and are the
        # difference between "a browser test failed" and knowing why without
        # reproducing it locally.
        if: failure()
        with:
          name: playwright-report
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7

  # The walkthrough, against a real directory and a real inbox.
  #
  # Everything else in this file proves a piece to a test runner. This proves
  # the pieces fit: accounts arrive from an LDAP server, a rename stays one
  # account, a run that gets nothing back refuses to act, a directory renames
  # somebody over SCIM, a registration is confirmed from a message that
  # actually arrived, and the export leaves without a password in it.
  #
  # It is the slowest job here — two container images and a server — and it
  # is worth it for one reason: none of those hops has a test that would fail
  # if the wiring between them broke.
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portico
          POSTGRES_PASSWORD: portico
          POSTGRES_DB: portico
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portico"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # No frontend build: the walkthrough talks to the API and never opens a
      # page. internal/web/dist carries a committed .gitkeep so a Go-only
      # build still compiles, and the server says the UI is missing rather
      # than serving a blank one.
      - run: CGO_ENABLED=0 go build -o portico ./cmd/server

      - name: Start the directory and the inbox
        run: docker compose -f deploy/dev-stack/compose.yml up -d --wait

      # Its own database. The initial administrator is created once per
      # database and never has its password changed afterwards, so sharing
      # one with another job would mean signing in with the wrong password
      # against an account that job created.
      - name: Create the walkthrough database
        run: psql "$DSN" -c 'CREATE DATABASE portico_walk'
        env:
          DSN: postgres://portico:portico@localhost:5432/portico?sslmode=disable

      - name: Start Portico
        run: |
          PORTICO_ADDR=127.0.0.1:8410 \
          PORTICO_PUBLIC_URL=http://127.0.0.1:8410 \
          PORTICO_DB_DSN="$PORTICO_DB_DSN" \
          PORTICO_JWT_SECRET=$(openssl rand -hex 32) \
          PORTICO_ENCRYPTION_KEY=$(openssl rand -hex 32) \
          PORTICO_SMTP_HOST=127.0.0.1 \
          PORTICO_SMTP_PORT=1026 \
          PORTICO_SMTP_ENCRYPTION=none \
          PORTICO_SMTP_FROM=portico@example.test \
          PORTICO_INITIAL_ADMIN_PASSWORD=ci-admin-password \
            ./portico >portico.log 2>&1 &
          # Waited on until it can actually sign somebody in, not until
          # /ready answers. /ready says the database is reachable, which is
          # true while migrations are still running and before the first
          # tenant and administrator exist — and the walkthrough's first act
          # is to create a tenant with the CLI against that same database. A
          # run against a fresh database failed once here with
          # TENANT_NOT_FOUND for a tenant the CLI had just created and the
          # database really held. I could not reproduce it; a sign-in is the
          # signal that says migrations ran and the bootstrap finished, so
          # that is what this waits for rather than the weaker one.
          for _ in $(seq 1 60); do
            if curl -sf -X POST http://127.0.0.1:8410/api/v1/auth/login \
                 -H 'Content-Type: application/json' \
                 -d '{"identifier":"admin","password":"ci-admin-password"}' \
                 | grep -q '"code":"SUCCESS"'; then
              exit 0
            fi
            sleep 1
          done
          echo "Portico never signed anybody in:" && cat portico.log && exit 1
        env:
          PORTICO_DB_DSN: postgres://portico:portico@localhost:5432/portico_walk?sslmode=disable

      # The federation steps are skipped, out loud, when examples/mock-sp is
      # not in the checkout — so this job reports what it actually ran rather
      # than passing for having found nothing to do.
      - name: Walk the flow
        run: ./hack/walk-the-flow.sh
        env:
          PORTICO_URL: http://127.0.0.1:8410
          PORTICO_DB_DSN: postgres://portico:portico@localhost:5432/portico_walk?sslmode=disable

      # The failure is usually in the server, not in the script.
      - name: Server log
        if: failure()
        run: |
          tail -100 portico.log
          docker compose -f deploy/dev-stack/compose.yml logs --tail=50
