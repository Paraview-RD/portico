name: Feature request
description: Suggest something Portico should do
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Some things are **out of scope on purpose** for the current version —
        custom roles and permissions, third-party and social sign-in, SCIM,
        webhooks, MFA, and rate limiting. Several are already scheduled; see
        the roadmap in
        [the requirements document](https://github.com/paraview/portico/blob/main/docs/requirements/v0.1-requirements.md).

        That does not make anything permanently off the table, but a request
        for something already on the roadmap is more useful as a comment on
        the existing plan than as a new issue.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >
        Describe the situation, not the solution. What are you doing today, and
        where does it fall down?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you considered instead?
      description: >
        Including working around it outside Portico — at the reverse proxy, or
        in the system consuming it. If that is possible but unpleasant, say why.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I have read the "Deliberately not included" list and this is not one of those, or I have explained why it should be reconsidered
          required: true
