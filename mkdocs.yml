# The documentation that ships inside the binary.
#
# Built into internal/docs/site and embedded, so the manual an operator opens
# is necessarily the manual for the version they are running. A site hosted
# somewhere else drifts, and the failure mode is somebody following
# instructions for a release they do not have.
#
# There is now a copy hosted somewhere else — mkdocs.pages.yml builds this
# same source for GitHub Pages, because somebody deciding whether to run
# Portico has to be able to read what it does before they install it. That
# does not retract the paragraph above; it is the same trade-off, taken
# knowingly, with the drift stated on the page instead of left to be
# discovered. The published copy carries a bar saying which branch it was
# built from and pointing at the reader's own /docs. This build does not,
# and the flag that decides is set there and absent here.
#
#   ./hack/build-docs.sh      build it (and restore the .gitkeep mkdocs eats)
#   mkdocs serve              write it, with reload
#
# Only the pages an operator or an integrator needs are here. The conventions
# this project holds itself to are for contributors and stay in the
# repository — shipping "how we write Go" inside somebody's identity server
# is noise in the one place they are looking for an answer.
site_name: Portico
site_description: A self-hostable identity platform — single sign-on, multi-tenant, SCIM and LDAP.
# No repo_url, and the reason is the same one that turned off Google Fonts:
# Material renders it as a header widget that asks api.github.com for the
# star count and the latest release on every page load. This manual is served
# from inside somebody's identity server, often on a network with no route
# out — where those calls hang rather than fail — and asking a third party
# for anything tells them which of their deployments is reading which page.
#
# It was invisible until the Content-Security-Policy stopped blocking
# Material's inline scripts, because a bundle that threw on load never got as
# far as making the request. The repository is linked from the pages that
# have a reason to link it.
edit_uri: ""

docs_dir: docs
site_dir: internal/docs/site

# Served from a subpath inside the application, so links have to be relative
# to it rather than to a host root.
use_directory_urls: true

exclude_docs: |
  README.md
  *-conventions.md
  design-principles.md
  dev-stack.md
  requirements/

theme:
  name: material
  custom_dir: mkdocs-overrides
  # No Google Fonts. Material asks fonts.googleapis.com for Roboto, and this
  # server's own Content-Security-Policy has always blocked the request — so
  # the manual renders in the browser's fallback and every page load spends
  # a round trip finding that out. A self-hosted product shipped as one
  # binary should not reach a CDN to draw its own documentation, least of
  # all in a deployment with no route to the internet. The stack it uses
  # instead is named in docs/stylesheets/portico.css.
  font: false
  features:
    - navigation.sections
    - navigation.top
    # Previous and next at the foot of every page, in the order nav below
    # declares. Most of these pages are dead ends without it: outside the
    # home page and the access guide, which link out seven times each, the
    # rest carry one to three links between them, so a reader who finishes
    # Federation has exactly one way onward that is not the sidebar.
    #
    # Taken from nav rather than written per page, which is the whole reason
    # to prefer it over a hand-kept "see also" block — a second list of
    # relationships is a second thing to forget, and this repository has
    # already had nav_translations fall behind a rename once.
    - navigation.footer
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light

# Loaded after the theme's own stylesheet, which is what lets it override
# Material's palette variables without fighting specificity.
extra_css:
  - stylesheets/portico.css

plugins:
  - search
  # Suffix structure: ldap.md and ldap.zh.md sit side by side.
  #
  # Chosen over a directory per language for one concrete reason: these pages
  # reference each other constantly, and the plugin wants those links written
  # without the language suffix — so [scim.md](scim.md) is correct in both
  # files and the existing links did not have to be rewritten. A directory
  # split would have rewritten every one of them.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            What it does: 能做什么
            Account Management: 账号管理
            Getting in: 访问指南
            Organizations and groups: 组织与用户组
            Reading a directory: 从目录读取
            Provisioning: 目录供给
            Settings and audit: 系统设置与审计
            Single Sign-On: 单点登录
            SSO Protocols: 单点登录协议
            Federation: 单点登录配置
            Integration guides: 集成指南
            Webhooks: 事件订阅
            Field mappings: 字段映射
            Operations: 运维
            Integrations: 外部依赖
            Running in production: 生产环境部署
            Configuration: 配置参考
            CLI reference: CLI 参考
            Publishing a demo: 发布公开 demo
            Backup and restore: 备份与恢复
            Troubleshooting: 排查手册

extra:
  alternate:
    - name: English
      link: ./
      lang: en
    - name: 简体中文
      link: zh/
      lang: zh

nav:
  - Home: index.md
  - What it does: capabilities.md
  - Account Management:
    - Getting in: access-guide.md
    - Organizations and groups: organizations.md
    - Reading a directory: ldap.md
    - Provisioning: scim.md
    - Settings and audit: settings.md
  - Single Sign-On:
    - SSO Protocols: sso-protocols.md
    - Federation: federation.md
    - Integration guides: integration-guides.md
    - Webhooks: webhooks.md
    - Field mappings: field-mappings.md
  - Operations:
    - Integrations: integrations.md
    - Running in production: deployment.md
    - Configuration: configuration.md
    - CLI reference: cli.md
    - Publishing a demo: public-demo.md
    - Backup and restore: backup-and-restore.md
    - Troubleshooting: troubleshooting.md

# Dead links fail the build under --strict, which is the point of building
# the site in CI at all. These pages cross-reference each other densely
# enough that a rename would otherwise break several silently.
validation:
  links:
    unrecognized_links: warn
    absolute_links: warn
    # Anchors too, and this one was earned. scim.zh.md linked into
    # federation.md by its English anchor; that resolved while federation was
    # untranslated and silently stopped resolving the moment it was, because
    # a translated heading has a translated anchor. Without this the link
    # keeps working as a link and scrolls nowhere.
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      # Chinese headings survive as anchors. The default slugify drops
      # non-ASCII entirely, which turns "### 4.2 目录对接" into "#42" and
      # breaks every cross-document anchor into a translated page.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.superfences
  - pymdownx.details
