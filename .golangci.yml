version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
  exclusions:
    rules:
      # Generated code is not ours to lint.
      - path: internal/store/sqlcgen/
        linters: [all]
      # Tests deliberately use weak secrets and short passwords as fixtures.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
