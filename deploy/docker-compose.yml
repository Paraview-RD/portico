# Single-node deployment. Unlike earlier versions this needs a database
# service — the storage moved to PostgreSQL when multi-tenancy and the
# federation protocols came in, and a file-backed database is no longer the
# right trade.
#
#   export POSTGRES_PASSWORD=$(openssl rand -hex 16)
#   export PORTICO_JWT_SECRET=$(openssl rand -hex 32)
#   docker compose -f deploy/docker-compose.yml up -d
#
# Both are required and neither has a default: the password below is written
# with `:?`, so compose stops and says which one is missing rather than
# bringing up a database whose password came from a file in this repository.
#
# On first start the server creates an administrator on the documented
# default password and prints it to stderr. Sign in straight away: the
# account is refused until that password is replaced, and until somebody
# replaces it, anybody who can reach the port could. Set
# PORTICO_INITIAL_ADMIN_PASSWORD to choose a password instead.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-portico}
    volumes:
      - portico-db:/var/lib/postgresql/data
    # Not published by default: nothing outside this compose network needs
    # to reach the database. Uncomment to inspect it from the host.
    # ports:
    #   - "127.0.0.1:5443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portico} -d ${POSTGRES_DB:-portico}"]
      interval: 5s
      timeout: 5s
      retries: 10

  portico:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: portico:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bound to loopback on purpose: this is an admin console served over
      # plaintext HTTP, so the default must not be internet-reachable. Put a
      # TLS-terminating reverse proxy in front and change this to expose it.
      - "127.0.0.1:8410:8410"
    environment:
      PORTICO_DB_DSN: postgres://${POSTGRES_USER:-portico}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-portico}?sslmode=disable
      # Required: without it a random secret is generated at startup and
      # every session dies on restart.
      PORTICO_JWT_SECRET: ${PORTICO_JWT_SECRET:?set PORTICO_JWT_SECRET to a long random string}
      # Where people reach this deployment. Password-recovery links are built
      # from it, so it has to be the address a browser actually uses — not
      # the container's idea of itself.
      PORTICO_PUBLIC_URL: ${PORTICO_PUBLIC_URL:-http://localhost:8410}
      # Mail relay for password recovery. Leave the host empty and recovery
      # reports itself unavailable rather than accepting requests it cannot
      # fulfil.
      PORTICO_SMTP_HOST: ${PORTICO_SMTP_HOST:-}
      PORTICO_SMTP_PORT: ${PORTICO_SMTP_PORT:-587}
      PORTICO_SMTP_USERNAME: ${PORTICO_SMTP_USERNAME:-}
      PORTICO_SMTP_PASSWORD: ${PORTICO_SMTP_PASSWORD:-}
      PORTICO_SMTP_FROM: ${PORTICO_SMTP_FROM:-}
      PORTICO_SMTP_ENCRYPTION: ${PORTICO_SMTP_ENCRYPTION:-starttls}
      PORTICO_INITIAL_ADMIN_USERNAME: ${PORTICO_INITIAL_ADMIN_USERNAME:-admin}
      PORTICO_INITIAL_ADMIN_PASSWORD: ${PORTICO_INITIAL_ADMIN_PASSWORD:-}
      PORTICO_LOG_LEVEL: ${PORTICO_LOG_LEVEL:-info}

volumes:
  portico-db:
