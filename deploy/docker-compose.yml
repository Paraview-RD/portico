# Minimal single-node deployment. There is no database service because the
# database is a file inside the volume — that is the whole point of the
# sqlite default.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# On first start the server creates an administrator and prints a generated
# password once. Set KEYLITE_INITIAL_ADMIN_PASSWORD to choose it instead.

services:
  keylite:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: keylite:latest
    restart: unless-stopped
    ports:
      # Bound to loopback on purpose: this is an admin console served over
      # plaintext HTTP, so the default must not be internet-reachable. Put a
      # TLS-terminating reverse proxy in front and change this to expose it.
      - "127.0.0.1:8410:8410"
    volumes:
      - keylite-data:/data
    environment:
      # Required in production: without it a random secret is generated at
      # startup and every session dies on restart.
      KEYLITE_JWT_SECRET: ${KEYLITE_JWT_SECRET:?set KEYLITE_JWT_SECRET to a long random string}
      KEYLITE_INITIAL_ADMIN_USERNAME: ${KEYLITE_INITIAL_ADMIN_USERNAME:-admin}
      KEYLITE_INITIAL_ADMIN_PASSWORD: ${KEYLITE_INITIAL_ADMIN_PASSWORD:-}
      KEYLITE_LOG_LEVEL: ${KEYLITE_LOG_LEVEL:-info}

volumes:
  keylite-data:
